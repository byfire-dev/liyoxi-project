# 狸有戏 · 授权书 PDF 渲染验证（X-03 任务书 第 4 节、第 7 节第 1–3 条、第 11 节第 6 项）。
#
# 不是必过检查：不进 ci.yml 的汇总任务 required，失败不挡合并，只给 X-03 的验收出证据。
# 触发：改到验证工程、随附字体或本文件的 PR；手动。别的 PR 上不跑。
# 验证工程是独立工程（spikes/license-pdf，自己的锁文件），不进根工作区，所以这里只装它自己的依赖。
# 产物 license-pdf-out：本次运行渲染出的三份样张与两份报告。入库的那几份先清掉，免得渲染失败时把旧文件当成本次的结果传上去。
# 写法照 infra/ci/README.md 第 2 节：任务编号与名字相同，键不带引号，第三方 Action 固定到提交 SHA。
name: spike-license-pdf

on:
  workflow_dispatch:
  pull_request:
    paths:
      - spikes/license-pdf/**
      - infra/docker/server/fonts/**
      - .github/workflows/spike-license-pdf.yml

concurrency:
  group: spike-license-pdf-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  license-pdf:
    name: license-pdf
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: 冻结安装（验证工程自己的锁文件）
        run: pnpm --dir spikes/license-pdf install --frozen-lockfile
      - name: 清掉入库的样张与报告（产物只收本次运行渲染出来的）
        run: rm -rf spikes/license-pdf/out
      - name: 第 1 条：三份样张渲染成功
        run: pnpm --dir spikes/license-pdf render
      - name: 第 2 条：分页稳定
        run: pnpm --dir spikes/license-pdf test
      - name: 第 3 条：只靠随附字体（在 node:24-slim 容器里跑同一条渲染命令）
        run: pnpm --dir spikes/license-pdf render:container
      - name: 上传样张与报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-pdf-out
          path: spikes/license-pdf/out/
          if-no-files-found: warn
          retention-days: 30
