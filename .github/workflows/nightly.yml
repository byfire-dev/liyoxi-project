# 狸有戏 · 每晚任务（计划 第 5.5 节“每晚”一栏；02 第 5.3 节）。失败只告警，不进必过检查 required。
#
# 现在只有一条：Node 26 兼容。以 Node 24 开工，V1.0 提测前定是否切到 26。
# 触发：每晚定时；手动；另在改到本文件的 PR 上跑一次（工作流没进 main 之前不能手动触发）。
# 根 package.json 的 engines 把 Node 限在 24，.npmrc 开了 engine-strict；这里用环境变量把它关掉，否则 pnpm 拒绝运行。
name: nightly

on:
  schedule:
    # 每天 18:17（UTC），即北京时间次日 02:17
    - cron: "17 18 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly.yml

concurrency:
  group: nightly-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node26:
    name: node26
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NPM_CONFIG_ENGINE_STRICT: "false"
    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      # 数据库客户端是生成物，不入库（W0-05）：类型检查与测试之前先生成。这一步不连库
      - name: 生成数据库客户端
        run: pnpm db:generate
      - name: 类型
        run: pnpm typecheck
      # 以下三步给“测试”备库（W0-05 起 pnpm test 要连库）。往已有的任务里加 services、env 算放松类改动，所以都写成步骤：
      # 库用 compose 文件起，与 ci.yml 的“起 MinIO”同一种写法；镜像、端口、账号只写在 infra/compose/local.yml 一处，
      # 与 ci.yml 的服务容器是同一组值
      - name: 起 PostgreSQL 与 Redis
        run: docker compose -f infra/compose/local.yml up -d --wait postgres redis
      # 写进 GITHUB_ENV，后面的步骤（含“测试”）都读得到。取值与 ci.yml 的 verify 相同：本地开发的固定值，不是密钥
      - name: 连接参数
        run: printf "%s\n" "APP_ENV=test" "DATABASE_URL=postgresql://liyoxi:lyx-local-dev@localhost:5442/liyoxi" "REDIS_URL=redis://localhost:6389/0" >> "$GITHUB_ENV"
      # packages/db 的用例要连迁移库 lyx_migrate_check。写法同 ci.yml 的同名步骤
      - name: 空库跑全部迁移
        env:
          PGHOST: localhost
          PGPORT: "5442"
          PGUSER: liyoxi
          PGPASSWORD: lyx-local-dev
          DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/lyx_migrate_check
        run: psql -X -w -d postgres -c "CREATE DATABASE lyx_migrate_check" && pnpm db:deploy
      - name: 测试
        run: pnpm test
