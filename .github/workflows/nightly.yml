# 狸有戏 · 每晚任务（计划 第 5.5 节“每晚”一栏；02 第 5.3 节）。失败只告警，不进必过检查 required。
#
# 现在只有一条：Node 26 兼容。以 Node 24 开工，V1.0 提测前定是否切到 26。
# 触发：每晚定时；手动；另在改到本文件的 PR 上跑一次（工作流没进 main 之前不能手动触发）。
# 根 package.json 的 engines 把 Node 限在 24，.npmrc 开了 engine-strict；这里用环境变量把它关掉，否则 pnpm 拒绝运行。
name: nightly

on:
  schedule:
    # 每天 18:17（UTC），即北京时间次日 02:17
    - cron: "17 18 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly.yml

concurrency:
  group: nightly-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node26:
    name: node26
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NPM_CONFIG_ENGINE_STRICT: "false"
    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      - name: 类型
        run: pnpm typecheck
      - name: 测试
        run: pnpm test
