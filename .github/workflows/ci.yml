# 狸有戏 · CI（计划 第 5.5 节“M0 起”；D7 第 8.1 节）。
#
# 必过检查只有一个：汇总任务 required，它依赖全部必过任务。业主在 main 的保护规则里只设 required 一项。
# 必过任务并行跑（执行机 2 核，串成一个任务要十多分钟）。各任务各自检出、装依赖（pnpm 的仓库有缓存），
# 只挂自己用得到的服务容器：
#   verify          静态检查：lint、格式、换名、色值、类型、依赖方向、生成物与登记表的对账。不连库
#   test            各包的用例（infra 以外的测试项目），连同它们要的迁移库：首版迁移的等价性证明、枚举对账、MinIO；
#                   末尾是要迁移库或要排在测试之后的几道核对（api-check、约束名、待落地数、计划 第 8.2 节的表）
#   test-infra      infra 项目的用例（infra/ci 的检查脚本）
#   test-isolation  测试隔离：两个会话同时跑连库的测试项目
#   web             构建；后台与下载页的单测、构建、页面清单、冒烟
#   gates           密钥扫描、依赖审计、新增依赖发布时长、门禁自测
# 加检查的规矩（门禁改动分类按“只增”判，写法见 infra/ci/README.md）：
#   - 加一步：在用得上它的那个任务里新增一个完整的步骤（“- name:” 开头的一整段）。
#   - 加任务：新增一个完整的任务，并在 required 的 needs 里加一行。
#   - 删改已有的步骤或任务是放松类改动，只在单独的 gate-change PR 里做。
# 执行机只写在一处：verify 的 runs-on 带锚点 &runner，其余任务用 *runner 引用。改成自托管时只改那一处。
# 第三方 Action 一律固定到提交 SHA，行尾注明版本。CI 里不放任何密钥：下面的连接串是本地开发的固定值，
# 与 infra/compose/local.yml 相同，只对本次运行的服务容器有效。
name: ci

on:
  pull_request:
  push:
    branches: [main]

# PR：按分支分组，同一个分支的新提交取消在途的运行。
# 推到 main：按提交分组，一个提交一组，互不取消。不按分支分组，是因为同一组里排队的运行
# 会被更新的一个顶掉：连着合并几次时，中间那几次就不跑了。
concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# 连接参数对全部任务相同。没挂服务容器的任务里这两个端口上没有东西：哪一步去连，那一步就失败
env:
  APP_ENV: test
  DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/liyoxi
  REDIS_URL: redis://localhost:6389/0

jobs:
  # 静态检查。不挂服务容器：这里的步骤都不连库
  verify:
    name: verify
    runs-on: &runner ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出（带完整历史）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      # 忽略项只认 .prettierignore（门禁文件）。Prettier 缺省把 .gitignore 也当忽略文件读：
      # 往 .gitignore 加一行，就能让已入库的文件不被检查，而 .gitignore 不是门禁文件
      - name: 格式
        run: pnpm format:check --ignore-path .prettierignore
      - name: 换名检查
        run: pnpm check:rename
      - name: 页面不写色值
        run: pnpm lint:colors
      # 数据库客户端是生成物，不入库（W0-05）：类型检查之前先生成。这一步不连库
      - name: 生成数据库客户端
        run: pnpm db:generate
      - name: 类型
        run: pnpm typecheck
      # 小程序用 React 18、后台用 React 19，各装各的 @types/react：类型解析不许经 pnpm 的提升目录落到各工程装得不一样的包上，
      # 那里放哪一份不保证。上一步这一次是绿的也要查（infra/ci/README.md 第 7 节）
      - name: 类型解析不靠提升
        run: pnpm check:type-hoist
      - name: 依赖方向与五层
        run: pnpm depcheck
      # 只校验 schema.prisma，不连库（W0-05）
      - name: prisma validate
        run: pnpm db:validate
      # 契约生成物与源码无差异（W0-08）：重新生成后 git diff --exit-code。契约自测另有一条拿提交的生成物与
      # 现生成的逐字节比对，它在 test 任务里跑，那边的检出没有被这一步重新写过
      - name: contract:check
        run: pnpm contract:check
      # x01 名称登记（W0-09a）：先由登记数据重新生成归属表 docs/plan/x01-map.md 并 git diff --exit-code，再拿登记数据
      # 与 x01 正文、working/frag 对账（名称集合、数量、归属里程碑、写法）。不连库
      - name: 登记表对账
        run: pnpm registry:check
      # 状态机迁移表对照（W0-12）：packages/shared 的 25 张迁移表 ↔ 数据模型分组文档的状态机表，逐行 0 差异；
      # 状态机与状态列的清单与契约登记、01 分组 第 3.2 节、catalogue.json 一致。只读文件，不连库
      - name: 状态机迁移表对照
        run: pnpm machines:check
      # 接口侧注册表（W0-09b）：领域错误码、权限点、能力点、资源登记、通知场景、订阅点位、埋点事件，与登记文档
      # （registry-errors.md、registry-permissions.md）、working 底稿及各依据文档逐字段对账。只读文件，不连库，约 2 秒
      - name: 接口侧注册表对账
        run: pnpm api-registries:check
      # 路由元数据接管（W0-10）的五步检查，这里是第一步：只读文件，不连库。其余四步在 test 任务的末尾
      #（要迁移库，或要排在“测试”之后）。
      # 路由元数据对账：契约的路由清单 ↔ docs/api/working/routemap.json 逐字段 0 差异；公开、可选、验签路由 ↔ 黄金文件
      #（packages/contract/golden/）；x-step-up: skip ↔ 约定 C86 的登记表；路径里的资源段 ↔ 资源登记
      - name: 路由元数据对账
        run: pnpm contract:docs-check
      # 重新生成样式变量、后台主题、图标数据，与入库的生成物比对；顺带写出预览页（不入库），下一步上传
      - name: 设计生成物无差异
        run: pnpm design:check
      # 预览页：两端色板、字号、全部图标、状态标签。业主合并前对照规范与原型截图看（W0-26 任务书 第 8 节）
      - name: 上传设计预览页
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-preview
          path: packages/shared/dist/design-preview/
          if-no-files-found: error
          retention-days: 30
      - name: .env.example 核对
        run: node infra/ci/check-env-example.mjs
      # 只核对各包的状态文件合不合规（取值、字段、依赖指向）。状态汇总不入库，这里不生成也不比对
      - name: 状态文件核对
        run: node infra/ci/status-summary.mjs --check

  # 各包的用例，连同它们要的迁移库。根上的 pnpm test 在这里与 test-infra 两个任务里各跑一半：
  # 这边是 infra 以外的全部测试项目，那边是 infra 项目，合起来就是全量
  test:
    name: test
    runs-on: *runner
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_USER: liyoxi
          POSTGRES_PASSWORD: lyx-local-dev
          POSTGRES_DB: liyoxi
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U liyoxi -d liyoxi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6389:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: 检出（带完整历史）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      # 数据库客户端是生成物，不入库（W0-05）：测试之前先生成。这一步不连库
      - name: 生成数据库客户端
        run: pnpm db:generate
      # 以下几步是首版迁移的等价性证明（W0-05），排在“测试”之前：packages/db 的用例要连迁移库 lyx_migrate_check。
      # 参照库 lyx_schema_check 由底稿建，也就是在 PostgreSQL 17 上复核一遍 schema-check。校验工具有自己的锁文件（npm）；
      # NPM_CONFIG_IGNORE_SCRIPTS 让这次安装不执行任何包的安装脚本
      - name: 由底稿建参照库（schema-check）
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          PGHOST: localhost
          PGPORT: "5442"
          PGUSER: liyoxi
          PGPASSWORD: lyx-local-dev
        run: npm ci --prefix tools/schema-check --no-audit --no-fund --registry https://registry.npmjs.org/ && python3 tools/schema-check/check.py --keep
      - name: 空库跑全部迁移
        env:
          PGHOST: localhost
          PGPORT: "5442"
          PGUSER: liyoxi
          PGPASSWORD: lyx-local-dev
          DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/lyx_migrate_check
        run: psql -X -w -d postgres -c "CREATE DATABASE lyx_migrate_check" && pnpm db:deploy
      # 表、列、约束定义、索引定义、触发器、函数体六类逐项 0 差异，数量两组口径对得上；报告在下面上传
      - name: 系统目录比对
        run: pnpm db:catalog-diff
      - name: 再跑一遍迁移与比对（重复执行无副作用）
        env:
          DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/lyx_migrate_check
        run: pnpm db:deploy && pnpm db:catalog-diff
      # 业主合并前打开这份报告看（W0-05 任务书 第 8 节）。比对没过时也传，好看差在哪
      - name: 上传系统目录比对报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-catalog-diff
          path: packages/db/dist/catalog-diff/
          if-no-files-found: warn
          retention-days: 30
      # 枚举与库 CHECK 一致（W0-09a）：库里每条“列取值集合”形态的 CHECK ↔ 契约枚举，取值集合相等。只读，
      # 读的是前面“空库跑全部迁移”一步建的 lyx_migrate_check；主机与账号取 DATABASE_URL
      - name: 枚举与库 CHECK 一致
        run: pnpm enums:check
      # 本地存储驱动的用例要连 MinIO（W0-19）。镜像、端口、账号都取 infra/compose/local.yml，只起 minio 一个服务
      - name: 起 MinIO
        run: docker compose -f infra/compose/local.yml up -d --wait minio
      # 带 LYX_TEST_MINIO=required：MinIO 连不上即失败。后面“测试”一步里它连不上只会跳过
      - name: MinIO 驱动的用例
        env:
          LYX_TEST_MINIO: required
        run: pnpm exec vitest run packages/services/src/providers/storage/minio.test.ts
      # infra 以外的全部测试项目（写成排除：以后新加的测试项目自动落在这一边，不会两边都不跑）
      - name: 测试
        run: pnpm test --project '!infra'
      # 路由元数据接管（W0-10）：以下四步检查都只读，合计几秒（第一步“路由元数据对账”不连库，在 verify 任务）。
      # 前两步读前面“空库跑全部迁移”一步建的 lyx_migrate_check。后两步不连库，放在这里是因为“待落地数只减不增”
      # 要排在“测试”之后（已挂载处理器的清单由 apps/api 的测试装配导出，W0-22 接上），它出的清单又与下一步的同一步上传。
      # 路线图、各文档的结构化清单、分组文档三方自洽（tools/api-check/check.py）。“文档引用的表.列”一项未核对按失败算
      - name: api-check
        run: node infra/ci/api-check.mjs
      # natural 幂等的路由不登记幂等键，靠库里的唯一约束去重：契约里写的每个约束名在迁移后的库里都找得到（约定 C47）
      - name: natural 幂等的约束名核对
        run: node infra/ci/natural-constraints.mjs
      # “已落地”= 挂了真实处理器 + 有接口层测试引用 + 不在留桩清单。待落地数高于基线（infra/ci/landed-baseline.txt 的
      # 最后一行）即失败；顺带出按里程碑分组的待落地清单，下面上传
      - name: 待落地数只减不增
        run: node infra/ci/landed.mjs --check --report --out packages/contract/dist/pending-routes.md
      # 计划 第 8.2 节的表由路由清单生成：V1.0 的接口都有里程碑，表与清单无差异，行与列的合计相符。
      # 顺带出业主评审用的归属汇总（文档 × 里程碑 × operationId），下面上传
      - name: 里程碑归属与计划 第 8.2 节的表
        run: node infra/ci/plan-routes.mjs --check --summary packages/contract/dist/route-milestones.md
      # 业主评审里程碑归属时看 route-milestones.md（W0-10 任务书 第 8 节）；pending-routes.md 是里程碑退出时核对用的清单
      - name: 上传里程碑归属汇总与待落地清单
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: route-milestones
          path: |
            packages/contract/dist/route-milestones.md
            packages/contract/dist/pending-routes.md
          if-no-files-found: error
          retention-days: 30

  # infra 项目的用例：infra/ci 的检查脚本，真 git、真子进程。连库的几份自己建临时库；约束名核对的用例
  #（test/routes-gates.test.ts，W0-10）只读跑过迁移的 lyx_migrate_check，所以这里也建一份
  test-infra:
    name: test-infra
    runs-on: *runner
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_USER: liyoxi
          POSTGRES_PASSWORD: lyx-local-dev
          POSTGRES_DB: liyoxi
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U liyoxi -d liyoxi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: 检出（带完整历史）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      # 写法同 test 任务的“空库跑全部迁移”。跑迁移不用生成的客户端
      - name: 建迁移库（infra 的用例用）
        env:
          PGHOST: localhost
          PGPORT: "5442"
          PGUSER: liyoxi
          PGPASSWORD: lyx-local-dev
          DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/lyx_migrate_check
        run: psql -X -w -d postgres -c "CREATE DATABASE lyx_migrate_check" && pnpm db:deploy
      - name: 测试（infra 项目）
        run: pnpm test --project infra

  # 测试隔离（W0-05b；计划 第 6.3 节退出条件 ⑧）：两个会话同时跑连 PostgreSQL、Redis 的测试项目（挂了 globalSetup 的，
  # 现在是 packages/db、packages/services），都要绿，且两边用的库名与 Redis 前缀没有交集。只跑这些项目是为了给时长预算
  # 留余量（计划 第 5.5 节）：不带 --scope 是两个会话各跑一遍全量，等于把全量测试再跑两份，开销跟着全部用例一起涨。
  # 这一处与任务书验收的字面（CI 里跑全量）有出入，业主的结论见 docs/plan/status/W0-05b.md 偏差 12
  test-isolation:
    name: test-isolation
    runs-on: *runner
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_USER: liyoxi
          POSTGRES_PASSWORD: lyx-local-dev
          POSTGRES_DB: liyoxi
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U liyoxi -d liyoxi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6389:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: 检出（带完整历史）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      - name: 生成数据库客户端
        run: pnpm db:generate
      # packages/db 的用例要连迁移库 lyx_migrate_check：写法同 test 任务的“空库跑全部迁移”
      - name: 建迁移库（测试隔离用）
        env:
          PGHOST: localhost
          PGPORT: "5442"
          PGUSER: liyoxi
          PGPASSWORD: lyx-local-dev
          DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/lyx_migrate_check
        run: psql -X -w -d postgres -c "CREATE DATABASE lyx_migrate_check" && pnpm db:deploy
      # 与 test 任务一样起着 MinIO：两个会话里本地存储驱动的用例照跑，不因为连不上而跳过
      - name: 起 MinIO（测试隔离用）
        run: docker compose -f infra/compose/local.yml up -d --wait minio
      - name: test:isolation
        run: pnpm test:isolation --scope connected

  # 构建，后台与下载页（W0-28）。不挂服务容器：两个应用不连库，冒烟的接口由用例用路由拦截给夹具
  web:
    name: web
    runs-on: *runner
    timeout-minutes: 10
    steps:
      - name: 检出（带完整历史：冒烟的受影响范围要与基线比）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      - name: 构建
        run: pnpm -r --if-present build
      # W0-28：后台与下载页。根上的 pnpm test 不含这两个应用；它们的单测与构建各自共用一份 vite.config.ts
      #（D7 第 10.6 节第 10 项），所以单测在这里另跑一步
      - name: 后台与下载页单测
        run: pnpm --filter @liyoxi/admin --filter @liyoxi/portal test
      # 上一步“构建”已连带构建过一遍。这里照验收的写法再各跑一次：产物检查（文件名带哈希、写入构建号、
      # 生产构建不含夹具）在两个应用各自的 build 脚本里，这一步失败即产物不合格
      - name: 后台与下载页构建
        run: pnpm admin:build && pnpm portal:build
      # docs/plan/pages.md 是生成物：与菜单登记表、下载页页面清单不一致即失败
      - name: 页面清单无差异
        run: node infra/ci/pages/generate.mjs --check
      # 后台冒烟按受影响范围跑（计划 第 5.5 节）：PR 改到后台或它依赖的部分才跑，推到 main 一律跑。
      # 范围写在 apps/admin/scripts/e2e-affected.mjs 开头；结论在这一步的输出里
      - name: 后台冒烟要不要跑
        id: admin-e2e
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node apps/admin/scripts/e2e-affected.mjs --base "$BASE"
      # 浏览器按 Playwright 的版本缓存（版本取 apps/admin/package.json，那里写的是精确版本）。
      # 命中时“装浏览器”一步不再下载，只补系统依赖；没命中照常下载，任务结束时存进缓存
      - name: 取 Playwright 的版本
        id: playwright
        if: steps.admin-e2e.outputs.run == 'true'
        run: node -p '"version=" + require("./apps/admin/package.json").devDependencies["@playwright/test"]' >> "$GITHUB_OUTPUT"
      - name: 后台冒烟用的浏览器缓存
        if: steps.admin-e2e.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: 装后台冒烟用的浏览器
        if: steps.admin-e2e.outputs.run == 'true'
        run: pnpm --filter @liyoxi/admin exec playwright install --with-deps chromium
      # 一条用例：外壳 → 筛选表格 → 审核工作台 → 详情页；1366 × 768 下三个样例页没有横向滚动
      - name: 后台冒烟
        if: steps.admin-e2e.outputs.run == 'true'
        run: pnpm admin:e2e
      # 截图都是 1440 × 900：01–04 是外壳与三种骨架，05–12 是几个状态；用例失败时另有现场。
      # 业主合并前在运行页面的 Artifacts 里下载来看
      - name: 上传后台冒烟截图
        if: always() && steps.admin-e2e.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-e2e-shots
          path: |
            apps/admin/dist/e2e-shots/
            apps/admin/dist/e2e-results/
          if-no-files-found: error
          retention-days: 30

  # 密钥扫描、依赖审计、发布时长、门禁自测。门禁自测里连库的几例自己建临时库；“枚举与库 CHECK 一致”的反例
  # 要读跑过迁移的 lyx_migrate_check，所以这里也建一份
  gates:
    name: gates
    runs-on: *runner
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_USER: liyoxi
          POSTGRES_PASSWORD: lyx-local-dev
          POSTGRES_DB: liyoxi
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U liyoxi -d liyoxi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: 检出（带完整历史：密钥扫描与发布时长检查要用）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      - name: 密钥扫描
        run: node infra/ci/secret-scan.mjs
      - name: 依赖审计（高危阻断）
        run: pnpm audit --prod --audit-level high --registry https://registry.npmjs.org/
      - name: 新增依赖发布时长
        env:
          SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node infra/ci/check-release-age.mjs --since "$SINCE" --registry https://registry.npmjs.org/
      - name: 建迁移库（门禁自测用）
        env:
          PGHOST: localhost
          PGPORT: "5442"
          PGUSER: liyoxi
          PGPASSWORD: lyx-local-dev
          DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/lyx_migrate_check
        run: psql -X -w -d postgres -c "CREATE DATABASE lyx_migrate_check" && pnpm db:deploy
      - name: gates:selftest
        run: pnpm gates:selftest

  gate-classify:
    name: gate-classify
    if: github.event_name == 'pull_request'
    runs-on: *runner
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 检出 PR 的提交（带完整历史：要找与 main 的共同祖先）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: 取 main 上的分类脚本与清单（main 上还没有时用 PR 里的）
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/gate"
          if git cat-file -e "origin/$BASE_REF:infra/ci/classify-gate-changes.mjs" 2>/dev/null &&
            git cat-file -e "origin/$BASE_REF:infra/ci/gate-files.json" 2>/dev/null; then
            git show "origin/$BASE_REF:infra/ci/classify-gate-changes.mjs" > "$RUNNER_TEMP/gate/classify-gate-changes.mjs"
            git show "origin/$BASE_REF:infra/ci/gate-files.json" > "$RUNNER_TEMP/gate/gate-files.json"
            echo "用 $BASE_REF 上的分类脚本与清单"
          else
            cp infra/ci/classify-gate-changes.mjs infra/ci/gate-files.json "$RUNNER_TEMP/gate/"
            echo "$BASE_REF 上还没有分类脚本或清单，用 PR 里的"
          fi
      - name: 门禁改动分类（写 PR 描述顶部的清单，打 gate-touch）
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          node "$RUNNER_TEMP/gate/classify-gate-changes.mjs"
          --base "origin/$BASE_REF"
          --pr "$PR_NUMBER"
          --repo "$GITHUB_REPOSITORY"

  required:
    name: required
    if: always()
    needs:
      - verify
      - test
      - test-infra
      - test-isolation
      - web
      - gates
      - gate-classify
    runs-on: *runner
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: 取各任务的起止时间
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          > "$RUNNER_TEMP/jobs.json"
          || echo "没取到任务列表，时长记为未知"
      - name: 汇总判定与时长统计
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # 只在 PR 上跑的任务，推到 main 时会被跳过
          MAY_SKIP: ${{ github.event_name != 'pull_request' && 'gate-classify' || 'none' }}
        run: >-
          node infra/ci/ci-required.mjs
          --needs "$NEEDS_JSON"
          --jobs "$RUNNER_TEMP/jobs.json"
          --may-skip "$MAY_SKIP"
          --out ci-duration.json
      - name: 上传时长统计
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-duration
          path: ci-duration.json
          if-no-files-found: warn
          retention-days: 30
