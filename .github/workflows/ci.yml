# 狸有戏 · CI（计划 第 5.5 节“M0 起”；D7 第 8.1 节）。
#
# 必过检查只有一个：汇总任务 required，它依赖全部必过任务。业主在 main 的保护规则里只设 required 一项。
# 必过任务并行跑（执行机 2 核，串成一个任务要十多分钟）。各任务各自检出、装依赖（pnpm 的仓库有缓存），
# 只挂自己用得到的服务容器：
#   verify          静态检查：lint、格式、换名、色值、类型、依赖方向、生成物与登记表的对账。不连库
#   test            各包的用例（infra 以外的测试项目）的第一片，连同要迁移库的检查：首版迁移的等价性证明、枚举对账、MinIO；
#                   末尾是要迁移库或要排在测试之后的几道核对（api-check、约束名、待落地数、计划 第 8.2 节的表）
#   test-2、test-3、test-4  各包的用例的第二、三、四片。四片按用例文件等分，合起来是 infra 以外的全量
#   test-infra      infra 项目的用例（infra/ci 的检查脚本）
#   test-isolation、test-isolation-2 至 -8
#                   测试隔离：两个会话同时跑连库的测试项目。全量分成八片，一个任务跑一片，合起来是原来的全量
#   web             构建；后台与下载页的单测、构建、页面清单、样例冒烟与小程序截图
#   web-live        完整真实后台接口验收，自行准备本轮生产产物与owned资源，与web并行
#   gates           密钥扫描、依赖审计、新增依赖发布时长、门禁自测
# 加检查的规矩（门禁改动分类按“只增”判，写法见 infra/ci/README.md）：
#   - 加一步：在用得上它的那个任务里新增一个完整的步骤（“- name:” 开头的一整段）。
#   - 加任务：新增一个完整的任务，并在 required 的 needs 里加一行。
#   - 删改已有的步骤或任务是放松类改动，只在单独的 gate-change PR 里做。
# 执行机只写在一处：verify 的 runs-on 带锚点 &runner，其余任务用 *runner 引用。改成自托管时只改那一处。
# 第三方 Action 一律固定到提交 SHA，行尾注明版本。CI 里不放任何密钥：下面的连接串是本地开发的固定值，
# 与 infra/compose/local.yml 相同，只对本次运行的服务容器有效。
name: ci

on:
  pull_request:
  push:
    branches: [main]

# PR：按分支分组，同一个分支的新提交取消在途的运行。
# 推到 main：按提交分组，一个提交一组，互不取消。不按分支分组，是因为同一组里排队的运行
# 会被更新的一个顶掉：连着合并几次时，中间那几次就不跑了。
concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# 连接参数对全部任务相同。没挂服务容器的任务里这两个端口上没有东西：哪一步去连，那一步就失败
env:
  APP_ENV: test
  DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/liyoxi
  REDIS_URL: redis://localhost:6389/0

jobs:
  # 静态检查。不挂服务容器：这里的步骤都不连库
  verify:
    name: verify
    runs-on: &runner ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出（带完整历史）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      # 忽略项只认 .prettierignore（门禁文件）。Prettier 缺省把 .gitignore 也当忽略文件读：
      # 往 .gitignore 加一行，就能让已入库的文件不被检查，而 .gitignore 不是门禁文件
      - name: 格式
        run: pnpm format:check --ignore-path .prettierignore
      - name: 换名检查
        run: pnpm check:rename
      - name: 页面不写色值
        run: pnpm lint:colors
      # W1-05：规范 第 11 节的词不出现在它管的页面与错误码的默认文案里。规则表 infra/ci/copy-rules.json；不连库
      - name: 文案约束
        run: pnpm lint:copy
      # 数据库客户端是生成物，不入库（W0-05）：类型检查之前先生成。这一步不连库
      - name: 生成数据库客户端
        run: pnpm db:generate
      - name: 类型
        run: pnpm typecheck
      # 小程序用 React 18、后台用 React 19，各装各的 @types/react：类型解析不许经 pnpm 的提升目录落到各工程装得不一样的包上，
      # 那里放哪一份不保证。上一步这一次是绿的也要查（infra/ci/README.md 第 7 节）
      - name: 类型解析不靠提升
        run: pnpm check:type-hoist
      - name: 依赖方向与五层
        run: pnpm depcheck
      # 只校验 schema.prisma，不连库（W0-05）
      - name: prisma validate
        run: pnpm db:validate
      # 结构防漂移（W0-06b）里不连库的两步。其余四步要连库，在 test 任务的“上传系统目录比对报告”之后
      # 四类语句（DROP、RENAME、ALTER … TYPE、不带默认值的 SET NOT NULL）要带 “-- lyx:allow <理由>”；已经合并的迁移不能改。
      # 不连库。基线：PR 取目标分支，推到 main 取推之前的提交
      - name: 迁移规范
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: pnpm db:migration-lint --base "$BASE"
      # 草稿 docs/data-model/schema.prisma 与 constraints/ 已冻结：sha256 与登记值不同即失败。不连库
      - name: 草稿冻结守卫
        run: pnpm db:draft-freeze:check
      # 契约生成物与源码无差异（W0-08）：重新生成后 git diff --exit-code。契约自测另有一条拿提交的生成物与
      # 现生成的逐字节比对，它在 test 任务里跑，那边的检出没有被这一步重新写过
      - name: contract:check
        run: pnpm contract:check
      - name: 在役契约兼容（C77/C78）
        run: pnpm contract:compat
      # x01 名称登记（W0-09a）：先由登记数据重新生成归属表 docs/plan/x01-map.md 并 git diff --exit-code，再拿登记数据
      # 与 x01 正文、working/frag 对账（名称集合、数量、归属里程碑、写法）。不连库
      - name: 登记表对账
        run: pnpm registry:check
      # 状态机迁移表对照（W0-12）：packages/shared 的 25 张迁移表 ↔ 数据模型分组文档的状态机表，逐行 0 差异；
      # 状态机与状态列的清单与契约登记、01 分组 第 3.2 节、catalogue.json 一致。只读文件，不连库
      - name: 状态机迁移表对照
        run: pnpm machines:check
      - name: M1 状态机覆盖门禁
        run: pnpm machines:coverage -- --strict --contract
      - name: M1 留桩清单核对
        run: node infra/ci/check-stubs.mjs
      # 接口侧注册表（W0-09b）：领域错误码、权限点、能力点、资源登记、通知场景、订阅点位、埋点事件，与登记文档
      # （registry-errors.md、registry-permissions.md）、working 底稿及各依据文档逐字段对账。只读文件，不连库，约 2 秒
      - name: 接口侧注册表对账
        run: pnpm api-registries:check
      # 路由元数据接管（W0-10）的五步检查，这里是第一步：只读文件，不连库。其余四步在 test 任务的末尾
      #（要迁移库，或要排在“测试”之后）。
      # 路由元数据对账：契约的路由清单 ↔ docs/api/working/routemap.json 逐字段 0 差异；公开、可选、验签路由 ↔ 黄金文件
      #（packages/contract/golden/）；x-step-up: skip ↔ 约定 C86 的登记表；路径里的资源段 ↔ 资源登记
      - name: 路由元数据对账
        run: pnpm contract:docs-check
      # 重新生成样式变量、后台主题、图标数据，与入库的生成物比对；顺带写出预览页（不入库），下一步上传
      - name: 设计生成物无差异
        run: pnpm design:check
      # 预览页：两端色板、字号、全部图标、状态标签。业主合并前对照规范与原型截图看（W0-26 任务书 第 8 节）
      - name: 上传设计预览页
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-preview
          path: packages/shared/dist/design-preview/
          if-no-files-found: error
          retention-days: 30
      - name: .env.example 核对
        run: node infra/ci/check-env-example.mjs
      # 只核对各包的状态文件合不合规（取值、字段、依赖指向）。状态汇总不入库，这里不生成也不比对
      - name: 状态文件核对
        run: node infra/ci/status-summary.mjs --check
      # 状态字典键与契约枚举同名（W0-30a）：状态色调字典里写了“表.列”的条目，那一列在契约里绑定了枚举，
      # 取值都在枚举的取值之内。只读文件，不连库，约 1 秒
      - name: 状态字典键与契约枚举同名
        run: pnpm status-tone:check
      # 台账单项文件核对（W0-30）：留桩、计划变更、外部验证三个目录下的单项文件合不合规（键、状态取值、回补里程碑）。
      # 三张汇总不入库（pnpm plan:summaries 现生成），这里不生成也不比对。只读文件，不连库，不到 1 秒
      - name: 台账单项文件核对
        run: node infra/ci/plan-summaries.mjs --check

  # 各包的用例，连同它们要的迁移库。根上的 pnpm test 分在五个任务里跑，合起来就是全量：
  # infra 以外的全部测试项目分成四片，这里跑第一片，test-2、test-3、test-4 各跑一片；infra 项目在 test-infra
  test:
    name: test
    runs-on: *runner
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_USER: liyoxi
          POSTGRES_PASSWORD: lyx-local-dev
          POSTGRES_DB: liyoxi
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U liyoxi -d liyoxi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6389:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: 检出（带完整历史）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      # 数据库客户端是生成物，不入库（W0-05）：测试之前先生成。这一步不连库
      - name: 生成数据库客户端
        run: pnpm db:generate
      # 以下几步是首版迁移的等价性证明（W0-05），排在“测试”之前：packages/db 的用例要连迁移库 lyx_migrate_check。
      # 参照库 lyx_schema_check 由底稿建，也就是在 PostgreSQL 17 上复核一遍 schema-check。校验工具有自己的锁文件（npm）；
      # NPM_CONFIG_IGNORE_SCRIPTS 让这次安装不执行任何包的安装脚本
      - name: 由底稿建参照库（schema-check）
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          PGHOST: localhost
          PGPORT: "5442"
          PGUSER: liyoxi
          PGPASSWORD: lyx-local-dev
        run: npm ci --prefix tools/schema-check --no-audit --no-fund --registry https://registry.npmjs.org/ && python3 tools/schema-check/check.py --keep
      - name: 空库跑全部迁移
        env:
          PGHOST: localhost
          PGPORT: "5442"
          PGUSER: liyoxi
          PGPASSWORD: lyx-local-dev
          DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/lyx_migrate_check
        run: psql -X -w -d postgres -c "CREATE DATABASE lyx_migrate_check" && pnpm db:deploy
      # 表、列、约束定义、索引定义、触发器、函数体六类逐项 0 差异，数量两组口径对得上；报告在下面上传
      - name: 系统目录比对
        run: pnpm db:catalog-diff
      - name: 再跑一遍迁移与比对（重复执行无副作用）
        env:
          DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/lyx_migrate_check
        run: pnpm db:deploy && pnpm db:catalog-diff
      # 业主合并前打开这份报告看（W0-05 任务书 第 8 节）。比对没过时也传，好看差在哪
      - name: 上传系统目录比对报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-catalog-diff
          path: packages/db/dist/catalog-diff/
          if-no-files-found: warn
          retention-days: 30
      # 以下是结构防漂移（W0-06b），接管之后每个 PR 都跑。结构快照：另建一个空库跑完全部迁移，重新生成
      # packages/db/snapshot/structure.txt 后 git diff --exit-code。Prisma 对手写的 CHECK、部分索引、触发器不建也不查，少一个靠它看
      - name: 结构快照无差异
        run: pnpm db:snapshot:check
      # 拿前面 pnpm db:deploy 建出来的 lyx_migrate_check 与快照逐条比（只读），数量与快照、06 第 1 节三处对得上
      - name: 约束清单比对
        run: pnpm db:constraints:check
      # 分区子表不进快照，单独断言：兜底分区在且为空，当月与未来 3 个月的分区都在。读的也是 lyx_migrate_check
      - name: 分区断言
        run: pnpm db:partitions:assert
      # 15 份分组文档的字段表与 lyx_migrate_check 逐列比（列名、类型、可空），只读。schema-check 只认 PG* 环境变量
      - name: 分组文档字段表与迁移后的库一致（schema-check）
        env:
          PGHOST: localhost
          PGPORT: "5442"
          PGUSER: liyoxi
          PGPASSWORD: lyx-local-dev
        run: python3 tools/schema-check/check.py --existing lyx_migrate_check
      # 枚举与库 CHECK 一致（W0-09a）：库里每条“列取值集合”形态的 CHECK ↔ 契约枚举，取值集合相等。只读，
      # 读的是前面“空库跑全部迁移”一步建的 lyx_migrate_check；主机与账号取 DATABASE_URL
      - name: 枚举与库 CHECK 一致
        run: pnpm enums:check
      # 本地存储驱动的用例要连 MinIO（W0-19）。镜像、端口、账号都取 infra/compose/local.yml，只起 minio 一个服务
      # 迁移期先按固定摘要拉取，再供旧 Compose 名称使用；never 避免 latest 回查旧源。
      - name: 起 MinIO
        run: docker pull ghcr.io/sanqianyuejia/liyoxi/minio:RELEASE.2025-09-07T16-13-09Z@sha256:37a173a1c3042bdbbd9904bd3ab7c4c7b17f607b268220a607a685c14d94d1cb && docker tag ghcr.io/sanqianyuejia/liyoxi/minio:RELEASE.2025-09-07T16-13-09Z@sha256:37a173a1c3042bdbbd9904bd3ab7c4c7b17f607b268220a607a685c14d94d1cb ghcr.io/byfire-dev/minio:latest && docker compose -f infra/compose/local.yml up -d --wait --pull never minio
      # 带 LYX_TEST_MINIO=required：MinIO 连不上即失败。后面“测试”一步里它连不上只会跳过
      - name: MinIO 驱动的用例
        env:
          LYX_TEST_MINIO: required
        run: pnpm exec vitest run packages/services/src/providers/storage/minio.test.ts
      # infra 以外的全部测试项目（写成排除：以后新加的测试项目自动落在这一边，不会两边都不跑），按用例文件分成四片：
      # 这里跑第一片，test-2、test-3、test-4 各跑一片。分片是 Vitest 把文件路径取哈希、排序后按个数等分的，不看是哪个包的：
      # 哪个包的用例多了，四片一起涨。要加一片：加一个任务，各处的分母一起改（infra/ci/README.md 第 2 节）
      - name: 测试
        run: pnpm test --project '!infra' --shard=1/4
      - name: M1 接口主路径
        run: pnpm e2e
      - name: M3 接口主路径
        run: pnpm e2e:m3
      # 路由元数据接管（W0-10）：以下四步检查都只读，合计几秒（第一步“路由元数据对账”不连库，在 verify 任务）。
      # 前两步读前面“空库跑全部迁移”一步建的 lyx_migrate_check。后两步不连库，放在这里是因为“待落地数只减不增”
      # 要排在“测试”之后（已挂载处理器的清单由 apps/api 的测试装配导出，W0-22 接上），它出的清单又与下一步的同一步上传。
      # 路线图、各文档的结构化清单、分组文档三方自洽（tools/api-check/check.py）。“文档引用的表.列”一项未核对按失败算
      - name: api-check
        run: node infra/ci/api-check.mjs
      # natural 幂等的路由不登记幂等键，靠库里的唯一约束去重：契约里写的每个约束名在迁移后的库里都找得到（约定 C47）
      - name: natural 幂等的约束名核对
        run: node infra/ci/natural-constraints.mjs
      # 下一步要读已挂载清单 apps/api/dist/mounted-operations.json，它由 apps/api 的探活用例写出。“测试”分片之后，
      # 那份用例不一定落在本任务这一片里：这里单独跑它一遍。先删掉旧的、跑完再看文件在不在：用例改了名、
      # 一个文件都没跑到时在这一步就红，不让下一步拿着空清单照样通过
      - name: 导出已挂载清单（待落地数用）
        run: rm -f apps/api/dist/mounted-operations.json && pnpm exec vitest run apps/api/test/probes.test.ts && test -s apps/api/dist/mounted-operations.json
      # “已落地”= 挂了真实处理器 + 有接口层测试引用 + 不在留桩清单。待落地数高于基线（infra/ci/landed-baseline.txt 的
      # 最后一行）即失败；顺带出按里程碑分组的待落地清单，下面上传
      - name: 待落地数只减不增
        run: node infra/ci/landed.mjs --check --report --out packages/contract/dist/pending-routes.md
      - name: M0 与 M1 接口清零
        run: node infra/ci/landed.mjs --check --require M0,M1
      - name: M0、M1 与 M3 接口清零
        run: node infra/ci/landed.mjs --check --require M0,M1,M3
      # 计划 第 8.2 节的表由路由清单生成：V1.0 的接口都有里程碑，表与清单无差异，行与列的合计相符。
      # 顺带出业主评审用的归属汇总（文档 × 里程碑 × operationId），下面上传
      - name: 里程碑归属与计划 第 8.2 节的表
        run: node infra/ci/plan-routes.mjs --check --summary packages/contract/dist/route-milestones.md
      # 业主评审里程碑归属时看 route-milestones.md（W0-10 任务书 第 8 节）；pending-routes.md 是里程碑退出时核对用的清单
      - name: 上传里程碑归属汇总与待落地清单
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: route-milestones
          path: |
            packages/contract/dist/route-milestones.md
            packages/contract/dist/pending-routes.md
          if-no-files-found: error
          retention-days: 30
      # 下面步骤（W0-23）跑的是任务进程的构建产物。“构建”一步在 web 任务，产物过不来：这里只构建任务进程这一个包
      #（esbuild 把工作区的源码包连同生成的数据库客户端打进去，本任务开头已生成）
      - name: 构建任务进程（产物自检用）
        run: pnpm --filter @liyoxi/worker build
      # 自检需要正式通知场景等种子；在迁移等价性检查之后补齐，不放宽启动校验。
      - name: worker 自检数据库播种
        env:
          DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/lyx_migrate_check
        run: node apps/worker/dist/seed.js
      # 任务进程的产物能启动（W0-23）：--check 只做装配与自检——登记与契约对得上、契约登记的聚合类型都是库里存在的表，
      # 不连 Redis、不抢租约。产物是前面“构建”一步出的；只读已迁移并播种的自检库 lyx_migrate_check
      - name: worker 产物自检
        env:
          DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/lyx_migrate_check
        run: node apps/worker/dist/index.js --check
      # 托管 Redis 与队列库的兼容脚本（W0-23；验证项 V1）在本任务的 Redis 上跑通：脚本本身没坏，七项里自动的几项都过。
      # 条数与空闲时长缩到最小；主从切换、写满两项在这里记“需人工”。有“不通过”即非 0 退出
      - name: redis:compat
        env:
          REDIS_COMPAT_URL: redis://localhost:6389/0
