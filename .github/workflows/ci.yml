        image: postgres:17-trixie
        env:
          POSTGRES_USER: liyoxi
          POSTGRES_PASSWORD: lyx-local-dev
          POSTGRES_DB: liyoxi
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U liyoxi -d liyoxi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6389:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: 检出（带完整历史）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
