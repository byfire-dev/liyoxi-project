        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      # 数据库客户端是生成物，不入库（W0-05）。下一步“构建”连任务进程一起构建（W0-23），它的打包要把客户端打进产物：
      # 先生成。这一步不连库
      - name: 生成数据库客户端（构建用）
        run: pnpm db:generate
      - name: 构建
        run: pnpm -r --if-present build
      # W0-28：后台与下载页。根上的 pnpm test 不含这两个应用；它们的单测与构建各自共用一份 vite.config.ts
      #（D7 第 10.6 节第 10 项），所以单测在这里另跑一步
      - name: 后台与下载页单测
        run: pnpm --filter @liyoxi/admin --filter @liyoxi/portal test
      # 上一步“构建”已连带构建过一遍。这里照验收的写法再各跑一次：产物检查（文件名带哈希、写入构建号、
      # 生产构建不含夹具）在两个应用各自的 build 脚本里，这一步失败即产物不合格
      - name: 后台与下载页构建
        run: pnpm admin:build && pnpm portal:build
      # docs/plan/pages.md 是生成物：与菜单登记表、下载页页面清单不一致即失败
      - name: 页面清单无差异
        run: node infra/ci/pages/generate.mjs --check
      # 后台冒烟按受影响范围跑（计划 第 5.5 节）：PR 改到后台或它依赖的部分才跑，推到 main 一律跑。
      # 范围写在 apps/admin/scripts/e2e-affected.mjs 开头；结论在这一步的输出里
      - name: 后台冒烟要不要跑
        id: admin-e2e
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node apps/admin/scripts/e2e-affected.mjs --base "$BASE"
      # 浏览器按 Playwright 的版本缓存（版本取 apps/admin/package.json，那里写的是精确版本）。
      # 命中时“装浏览器”一步不再下载，只补系统依赖；没命中照常下载，任务结束时存进缓存
      - name: 取 Playwright 的版本
        id: playwright
        if: steps.admin-e2e.outputs.run == 'true'
        run: node -p '"version=" + require("./apps/admin/package.json").devDependencies["@playwright/test"]' >> "$GITHUB_OUTPUT"
      - name: 后台冒烟用的浏览器缓存
        if: steps.admin-e2e.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: 后台浏览器使用官方 Ubuntu HTTPS 源
        if: steps.admin-e2e.outputs.run == 'true'
        run: sudo env "PATH=$PATH" node infra/ci/normalize-browser-apt-source.mjs
      - name: 装后台冒烟用的浏览器
        if: steps.admin-e2e.outputs.run == 'true'
        run: pnpm --filter @liyoxi/admin exec playwright install --with-deps chromium
      # 一条用例：外壳 → 筛选表格 → 审核工作台 → 详情页；1366 × 768 下三个样例页没有横向滚动
      - name: 后台冒烟
        if: steps.admin-e2e.outputs.run == 'true'
        run: pnpm admin:e2e
      # 截图都是 1440 × 900：01–04 是外壳与三种骨架，05–12 是几个状态；用例失败时另有现场。
      # 业主合并前在运行页面的 Artifacts 里下载来看
      - name: 上传后台冒烟截图
        if: always() && steps.admin-e2e.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-e2e-shots
          path: |
            apps/admin/dist/e2e-shots/
            apps/admin/dist/e2e-results/
          if-no-files-found: error
          retention-days: 30
      # W0-27a：小程序。根上的 pnpm test 不含三个前端：请求层与四个端上封装的用例在这里跑（Node 环境，不起小程序运行时）
      - name: 小程序单测
        run: pnpm --filter @liyoxi/weapp test
      # 前面“构建”一步已经出过小程序的包（apps/weapp 的 build 脚本末尾也过这道门禁，超限构建就失败）。
      # 这里对着同一份产物再量一遍、把各包体积打印出来：主包 >1,500KB 或任一分包 >800KB 即失败
      - name: 小程序体积门禁
        run: node infra/ci/check-mp-size.mjs apps/weapp/dist
      # 小程序截图按受影响范围跑：PR 改到小程序或页面上看得见的设计变量才跑，推到 main 一律跑。
      # 范围写在 apps/weapp/scripts/shots-affected.mjs 开头；结论在这一步的输出里
      - name: 小程序截图要不要跑
        id: weapp-shots
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node apps/weapp/scripts/shots-affected.mjs --base "$BASE"
      - name: 小程序浏览器使用官方 Ubuntu HTTPS 源
        if: steps.weapp-shots.outputs.run == 'true'
        run: sudo env "PATH=$PATH" node infra/ci/normalize-browser-apt-source.mjs
      - name: 装小程序截图用的浏览器
        if: steps.weapp-shots.outputs.run == 'true'
        run: pnpm --filter @liyoxi/weapp exec playwright install --with-deps chromium
      # 先出一份 Taro 的 H5 构建，再用 Chromium 按 375 宽给已建的页各截一张。H5 是近似，不是小程序的渲染层：
      # 与真机的差异写在 apps/weapp/scripts/shots.mjs 开头
      - name: 小程序截图
        if: steps.weapp-shots.outputs.run == 'true'
        run: pnpm weapp:shots
      # 页面包的 PR 以这份产物为页面证据；业主合并前在运行页面的 Artifacts 里下载来看
      - name: 上传小程序截图
        if: always() && steps.weapp-shots.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weapp-shots
          path: apps/weapp/shots/dist/png/
          if-no-files-found: error
          retention-days: 30

  # 完整真实后台验收：同一默认全集、单worker与原finally；不依赖web的产物或job输出。
  # 独立托管runner自行准备本轮UI/API、媒体和owned库，保持原条件和执行预算。
  web-live:
    name: web-live
    runs-on: *runner
    timeout-minutes: 30
    steps:
      - name: 检出（带完整历史：冒烟的受影响范围要与基线比）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      # 客户端在本job独立生成，供真实造数和API构建使用；不从web下载产物，也不连库。
      - name: 生成数据库客户端（构建用）
        run: pnpm db:generate
      # 后台冒烟按受影响范围跑（计划 第 5.5 节）：PR 改到后台或它依赖的部分才跑，推到 main 一律跑。
      # 范围写在 apps/admin/scripts/e2e-affected.mjs 开头；结论在这一步的输出里
      - name: 后台冒烟要不要跑
        id: admin-e2e
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node apps/admin/scripts/e2e-affected.mjs --base "$BASE"
      # 浏览器按 Playwright 的版本缓存（版本取 apps/admin/package.json，那里写的是精确版本）。
      # 命中时“装浏览器”一步不再下载，只补系统依赖；没命中照常下载，任务结束时存进缓存
      - name: 取 Playwright 的版本
        id: playwright
        if: steps.admin-e2e.outputs.run == 'true'
        run: node -p '"version=" + require("./apps/admin/package.json").devDependencies["@playwright/test"]' >> "$GITHUB_OUTPUT"
      - name: 后台冒烟用的浏览器缓存
        if: steps.admin-e2e.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: 后台浏览器使用官方 Ubuntu HTTPS 源
        if: steps.admin-e2e.outputs.run == 'true'
        run: sudo env "PATH=$PATH" node infra/ci/normalize-browser-apt-source.mjs
      - name: 装后台冒烟用的浏览器
        if: steps.admin-e2e.outputs.run == 'true'
        run: pnpm --filter @liyoxi/admin exec playwright install --with-deps chromium
      # W1-02①：独立准备后对实际API与本轮生产构建走完整登录和页面链，受影响范围不变。
      - name: 后台真实接口验收的本地依赖
        if: steps.admin-e2e.outputs.run == 'true'
        run: docker compose -f infra/compose/local.yml up -d --wait postgres redis
      # 原图签发走实际 API 的本地存储驱动，首次调用会核对/建桶，因此与 PostgreSQL、Redis 一样需要就绪。
      - name: 后台真实接口验收的 MinIO
        if: steps.admin-e2e.outputs.run == 'true'
        run: docker pull ghcr.io/sanqianyuejia/liyoxi/minio:RELEASE.2025-09-07T16-13-09Z@sha256:37a173a1c3042bdbbd9904bd3ab7c4c7b17f607b268220a607a685c14d94d1cb && docker tag ghcr.io/sanqianyuejia/liyoxi/minio:RELEASE.2025-09-07T16-13-09Z@sha256:37a173a1c3042bdbbd9904bd3ab7c4c7b17f607b268220a607a685c14d94d1cb ghcr.io/byfire-dev/minio:latest && docker compose -f infra/compose/local.yml up -d --wait --pull never minio
      - name: 后台登录真实接口验收
        if: steps.admin-e2e.outputs.run == 'true'
        run: pnpm admin:e2e:live
      # live正常截图与失败现场均在本作业生成；独立artifact避免与web的样例截图争用名称。
      - name: 上传后台真实接口截图
        if: always() && steps.admin-e2e.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-e2e-live-shots
          path: |
            apps/admin/dist/e2e-shots/
            apps/admin/dist/e2e-live-results/
          if-no-files-found: error
          retention-days: 30

  # 密钥扫描、依赖审计、发布时长、门禁自测。门禁自测里连库的几例自己建临时库；“枚举与库 CHECK 一致”的反例
  # 要读跑过迁移的 lyx_migrate_check，所以这里也建一份
  gates:
    name: gates
    runs-on: *runner
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_USER: liyoxi
          POSTGRES_PASSWORD: lyx-local-dev
          POSTGRES_DB: liyoxi
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U liyoxi -d liyoxi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: 检出（带完整历史：密钥扫描与发布时长检查要用）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 装 pnpm（版本取 package.json 的 packageManager）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      - name: 密钥扫描
        run: node infra/ci/secret-scan.mjs
      - name: 依赖审计（高危阻断）
        run: pnpm audit --prod --audit-level high --registry https://registry.npmjs.org/
      - name: 新增依赖发布时长
        env:
          SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node infra/ci/check-release-age.mjs --since "$SINCE" --registry https://registry.npmjs.org/
      - name: 建迁移库（门禁自测用）
        env:
          PGHOST: localhost
          PGPORT: "5442"
          PGUSER: liyoxi
          PGPASSWORD: lyx-local-dev
          DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/lyx_migrate_check
        run: psql -X -w -d postgres -c "CREATE DATABASE lyx_migrate_check" && pnpm db:deploy
      # 门禁自测里任务进程的两例（W0-23：worker 产物自检、兼容脚本）跑的是构建产物，产物不在即红：
      # 先生成数据库客户端，再只构建任务进程这一个包
      - name: 生成数据库客户端（门禁自测用）
        run: pnpm db:generate
      - name: 构建任务进程（门禁自测用）
        run: pnpm --filter @liyoxi/worker build
      - name: gates:selftest
        run: pnpm gates:selftest

  gate-classify:
    name: gate-classify
    if: github.event_name == 'pull_request'
    runs-on: *runner
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 检出 PR 的提交（带完整历史：要找与 main 的共同祖先）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: 取 main 上的分类脚本与清单（main 上还没有时用 PR 里的）
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/gate"
          if git cat-file -e "origin/$BASE_REF:infra/ci/classify-gate-changes.mjs" 2>/dev/null &&
            git cat-file -e "origin/$BASE_REF:infra/ci/gate-files.json" 2>/dev/null; then
            git show "origin/$BASE_REF:infra/ci/classify-gate-changes.mjs" > "$RUNNER_TEMP/gate/classify-gate-changes.mjs"
            git show "origin/$BASE_REF:infra/ci/gate-files.json" > "$RUNNER_TEMP/gate/gate-files.json"
            echo "用 $BASE_REF 上的分类脚本与清单"
          else
            cp infra/ci/classify-gate-changes.mjs infra/ci/gate-files.json "$RUNNER_TEMP/gate/"
            echo "$BASE_REF 上还没有分类脚本或清单，用 PR 里的"
          fi
      - name: 门禁改动分类（写 PR 描述顶部的清单，打 gate-touch）
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          node "$RUNNER_TEMP/gate/classify-gate-changes.mjs"
          --base "origin/$BASE_REF"
          --pr "$PR_NUMBER"
          --repo "$GITHUB_REPOSITORY"

  required:
    name: required
    if: always()
    needs:
      - verify
      - test
      - test-2
      - test-3
      - test-4
      - test-infra
      - test-isolation
      - test-isolation-2
      - test-isolation-3
      - test-isolation-4
      - test-isolation-5
      - test-isolation-6
      - test-isolation-7
      - test-isolation-8
      - web
      - web-live
      - gates
      - gate-classify
    runs-on: *runner
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 装 Node（版本取 .nvmrc）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: 取各任务的起止时间
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          > "$RUNNER_TEMP/jobs.json"
          || echo "没取到任务列表，时长记为未知"
      - name: 汇总判定与时长统计
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # 只在 PR 上跑的任务，推到 main 时会被跳过
          MAY_SKIP: ${{ github.event_name != 'pull_request' && 'gate-classify' || 'none' }}
        run: >-
          node infra/ci/ci-required.mjs
          --needs "$NEEDS_JSON"
          --jobs "$RUNNER_TEMP/jobs.json"
          --may-skip "$MAY_SKIP"
          --out ci-duration.json
      - name: 上传时长统计
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-duration
          path: ci-duration.json
          if-no-files-found: warn
          retention-days: 30
