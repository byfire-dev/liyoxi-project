name: e2e-repeat

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-repeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m1-repeat:
    name: m1-repeat
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/liyoxi
      REDIS_URL: redis://localhost:6389/0
    steps:
      - name: 检出主分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 装 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      - name: 生成数据库客户端
        run: pnpm db:generate
      - name: 起 PostgreSQL 与 Redis
        run: docker compose -f infra/compose/local.yml up -d --wait postgres redis
      - name: M1 主路径连续十次
        run: node infra/ci/e2e-repeat.mjs --times 10
      - name: 保存连续运行结果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-e2e-repeat
          path: apps/api/dist/e2e-repeat/
          if-no-files-found: error
          retention-days: 30
  m3-repeat:
    name: m3-repeat
    needs: m1-repeat
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/liyoxi
      REDIS_URL: redis://localhost:6389/0
    steps:
      - name: 检出主分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 装 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      - name: 生成数据库客户端
        run: pnpm db:generate
      - name: 起 PostgreSQL 与 Redis
        run: docker compose -f infra/compose/local.yml up -d --wait postgres redis
      - name: M3 主路径连续十次
        run: node infra/ci/m3-repeat.mjs --times 10
      - name: 保存 M3 连续运行结果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-e2e-repeat
          path: apps/api/dist/m3-e2e-repeat/
          if-no-files-found: error
          retention-days: 30
  # 手动从本仓 codex 分支核对冻结候选，不接触部署/凭据；M1/M3 原 main 条件保持。
  m2-repeat:
    name: m2-repeat
    needs: m3-repeat
    if: always() && !cancelled() && ((github.ref == 'refs/heads/main' && needs.m3-repeat.result == 'success') || (startsWith(github.ref, 'refs/heads/codex/') && needs.m3-repeat.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://liyoxi:lyx-local-dev@localhost:5442/liyoxi
      REDIS_URL: redis://localhost:6389/0
    steps:
      - name: 检出本次候选源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 装 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 装 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 冻结安装
        run: pnpm install --frozen-lockfile
      - name: 生成数据库客户端
        run: pnpm db:generate
      - name: 起 PostgreSQL 与 Redis
        run: docker compose -f infra/compose/local.yml up -d --wait postgres redis
      - name: M2 主路径连续十次
        run: node infra/ci/m2-repeat.mjs --times 10
      - name: 保存 M2 连续运行结果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-e2e-repeat
          path: apps/api/dist/m2-e2e-repeat/
          if-no-files-found: error
          retention-days: 30
