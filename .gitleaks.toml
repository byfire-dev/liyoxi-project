# 狸有戏 · 密钥扫描（gitleaks）的配置。规则全用 gitleaks 自带的默认规则，这里只放本仓库误报的最小放行。
# 每一条放行都写明：放行什么、为什么是误报。新增或修改放行是放松类门禁改动，只在单独的 gate-change PR 里做。
# 由 infra/ci/secret-scan.mjs 读取。

[extend]
useDefault = true

# 放行 1：tools/api-check 下三个核对脚本里的文件名 00-conventions.md。
# 原因：generic-api-key 规则见到 “api” 后面跟一个带引号的字符串就起疑，这里的字符串是接口约定文档的文件名
# （docs/api/00-conventions.md），不是密钥。命中的三处都在提交 adcfe08 里：
# check.py 第 60 行、gen_registries.py 第 59 行、gen_permissions.py 第 333 行。
# 范围收到最小：只对这条规则、只对这个目录下的 .py 文件、只对含这个文件名的行生效。
[[allowlists]]
description = "tools/api-check：接口约定文档的文件名 00-conventions.md 被 generic-api-key 误判"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tools/api-check/[a-z_]+\.py$''']
regexTarget = "line"
regexes = ['''00-conventions\.md''']

# 放行 2：三份 ASR 回调测试共用的公开固定十六进制测试向量。
# 远端历史报告的 11 项重复命中，均由这些测试构造并验证原始字节；没有读取真实凭据。
# 只匹配命中 secret 的完整固定值，不能因同一行出现测试向量而放行其他 key。
[[allowlists]]
description = "ASR 回调：公开固定测试向量，限定三份测试文件"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^packages/services/src/(kernel/env-asr-callback|providers/asr/callback|ops/asr-callback-send)\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^0123456789abcdef0123456789abcdef$''']

# 放行 3：两份 ASR 回调测试的既定 HMAC 签名结果，不是用于授权外部服务的密钥。
# 远端历史报告的 7 项重复命中；仅放行这一个完整向量结果，不匹配任意签名格式。
[[allowlists]]
description = "ASR 回调：既定签名结果，限定两份向量测试"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^packages/services/src/(kernel/env-asr-callback|providers/asr/callback)\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^Te8AxwzKLiZJsOeVld_9zXls7UG5pdDRXsXTPf\-vPuA$''']

# 放行 4：W2-16 后台 E2E 为本轮隔离库内动态测试身份设置的固定口令。
# 远端历史报告的 5 项重复命中；该值随测试创建身份，不来自平台或部署配置。
# 只允许这份测试中的这一完整字面量，不允许该文件其他口令或密钥。
[[allowlists]]
description = "W2-16 协议 E2E：动态测试身份的固定口令"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/admin/test/e2e/w216-agreements-readonly\.ts$''']
regexTarget = "secret"
regexes = ['''^Liyoxi\-2026\-agreements$''']

# 放行 5：W2-27 隔离观测演练中已公开的唯一固定测试键，不是生产凭据，也不是已过期证书。
