packages:
  - "apps/*"
  - "packages/*"

# 安装脚本默认不执行，只放行下面的白名单（02 第 5.1 节第 3 条）
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - "@tarojs/binding"
  - esbuild
  - prisma
  - sharp

# 发布未满 7 天的版本不安装，单位是分钟（02 第 5.1 节第 2 条；ADR-035）
minimumReleaseAge: 10080

# 一个包的发布可信级别不得低于它更早发布的版本（按发布日期比，不按版本号）
trustPolicy: no-downgrade

# 可信级别的豁免，逐个写到精确版本，原因登记在 02 第 5.5 节
trustPolicyExclude:
  - "semver@6.3.1"
  # 以下三条是小程序的 Taro 4.2.1（Vite 编译器）工具链要的（W0-27a），不豁免装不上；经过记在 docs/plan/status/W0-27a.md。
  # 三个包都只在构建时用，不进小程序的包。发布账号与各自的其他版本相同，只是老的维护线发版不带来源证明，
  # 而同一个包更早发布的某个版本带过。Taro 升到不再用 Vite 4 的版本后，这三条一并删掉
  # vite 4 线都不带来源证明，5.0.0（2023-11）起才带：在那之后发布的 4.5.1–4.5.14 全被拦。4.5.14 是 02 第 5.5 节锁定的版本，
  # 能装的 4.5.0 多十几条已知通告（都是开发服务器的）
  - "vite@4.5.14"
  # vite 4 要 rollup ^3.27.1。rollup 自 2025-09 起才带来源证明；3.30.0（2026-02）是 3 线上唯一修了 GHSA-mw96-cpmx-2vgc 的版本
  - "rollup@3.30.0"
  # @tarojs/vite-runner@4.2.1 要 ^4.1.1，4 线上只有这一个版本满足；同线更早的 4.0.4 带过来源证明
  - "@vitejs/plugin-legacy@4.1.1"

# 依赖审计（高危阻断）的处理：上游把有高危通告的传递依赖钉在精确版本上、自己又没有放出修复版时，
# 在这里把它覆盖到已修复的版本。写法带上“父包@版本>”：只改这一个父包的这一条依赖，别处不受影响；
# 父包一升级，这一行自动失效，审计重新变红，届时删掉这一行。逐个写到精确版本并写明通告与是谁钉的。
# 加、改这里是放松类门禁改动，走单独的 gate-change PR。
overrides:
  # GHSA-97r2-qh9m-474h、GHSA-wp97-x4hv-qvhp、GHSA-7rv5-mrxv-xcr9 均修复于 1.6.8；2026-09-29 发布，已满 7 天。
  # router-core 原范围 ^1.6.2；临时精确限定安全补丁，避免连带升到 1.7；父包升级后重核并删掉此项。
  "@tanstack/router-core@1.171.32>seroval": 1.6.8
  # GHSA-3f6p-5ww8-9rcr（修复于 3.22.0）。命令行包 prisma 7.x 钉在 mysql2@3.15.3。取 3 线发布满 7 天的最新版
  "prisma@7.9.1>mysql2": 3.24.4
  # GHSA-ggr8-5vv4-36mx（修复于 8.0.0）。@prisma/config 7.x 钉在 deepmerge-ts@7.1.5
  "@prisma/config@7.9.1>deepmerge-ts": 8.0.2
  # 这一条不是覆盖到修复版，是去掉一条依赖（"-" 是 pnpm 去掉依赖的写法；W0-27a）：@nutui/nutui-react-taro@3.0.20 把命令行工具
  # codesandbox 列成了运行依赖，组件代码并不引它。它带进来近两百个陈旧的包（pacote 2、axios 0.18 等），生产依赖审计多出
  # 十几条高危，其中几条没有修复版；还得再豁免一条可信级别（semver@5.7.2）。NutUI 升级后这一行自动失效，届时重看
  "@nutui/nutui-react-taro@3.0.20>codesandbox": "-"
