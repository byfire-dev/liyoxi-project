<sc-if value="{{showB}}" hint-placeholder-val="{{true}}"><article style="background: #FFFFFF; border-radius: 14px; padding: 14px 12px; display: flex; gap: 10px; align-items: flex-start;"><sc-if value="{{bOk}}" hint-placeholder-val="{{false}}"><input type="checkbox" aria-label="选择《老街烟火》" checked="{{b}}" onChange="{{toggleB}}" style="flex-shrink: 0; width: 20px; height: 20px; margin: 30px 0 0; accent-color: #C4501B;"></sc-if><sc-if value="{{bPending}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="flex-shrink: 0; width: 20px; height: 20px; margin-top: 30px; box-sizing: border-box; border: 1px solid #D6CFC4; border-radius: 4px; background: #F1ECE4;"></span></sc-if><div aria-hidden="true" style="flex-shrink: 0; position: relative; width: 60px; height: 80px; border-radius: 6px; background: #4E6B5A;"><span style="position: absolute; right: 8px; top: 8px; writing-mode: vertical-rl; font-family: 'Noto Serif SC', serif; font-size: 12px; font-weight: 900; color: #FFFFFF;">老街烟火</span></div><div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;"><span style="display: flex; align-items: center; gap: 6px;"><span style="font-size: 15px; font-weight: 600;">老街烟火</span><sc-if value="{{bPending}}" hint-placeholder-val="{{true}}"><span style="flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: #FBEDE5; color: #A63F12; white-space: nowrap;">积分价已变动</span></sc-if></span><span style="font-size: 13px; color: #6F665B;">都市温情 · 整部 50 集</span><sc-if value="{{bPending}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; line-height: 1.5; color: #A63F12;"><span style="display: block;">积分价由 2,000 调整为 2,200，</span><span style="display: block;">确认后可订购</span></span></sc-if><sc-if value="{{bOk}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #6F665B;">可使用至 2028-03-31</span></sc-if><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;"><span style="display: flex; align-items: baseline; gap: 6px;"><span style="font-size: 16px; font-weight: 700; color: #C4501B; font-variant-numeric: tabular-nums;">1,980<span style="font-size: 12px; font-weight: 600;"> 积分</span></span><span style="font-size: 12px; color: #6F665B; text-decoration: line-through;">2,200</span></span><sc-if value="{{bOk}}" hint-placeholder-val="{{false}}"><a href="Mall.dc.html" style="min-height: 32px; padding: 0 12px; border-radius: 16px; display: flex; align-items: center; font-size: 13px; border: 1px solid #E7E1D8;">查看详情</a></sc-if></div><sc-if value="{{bPending}}" hint-placeholder-val="{{true}}"><span style="display: flex; justify-content: flex-end; gap: 8px;"><button type="button" onClick="{{removeB}}" style="min-height: 32px; padding: 0 12px; border-radius: 16px; display: flex; align-items: center; font-size: 13px; border: 1px solid #E7E1D8; background: #FFFFFF; font-family: inherit; color: #1D1A16; cursor: pointer;">删除</button><button type="button" onClick="{{confirmB}}" style="min-height: 32px; padding: 0 12px; border-radius: 16px; display: flex; align-items: center; font-size: 13px; border: 1px solid #C4501B; background: #FFFFFF; font-family: inherit; color: #A63F12; cursor: pointer;">确认新价格</button></span></sc-if></div></article></sc-if>
<sc-if value="{{showC}}" hint-placeholder-val="{{true}}"><article style="background: #FFFFFF; border-radius: 14px; padding: 14px 12px; display: flex; gap: 10px; align-items: flex-start;"><span aria-hidden="true" style="flex-shrink: 0; width: 20px; height: 20px; margin-top: 30px; box-sizing: border-box; border: 1px solid #D6CFC4; border-radius: 4px; background: #F1ECE4;"></span><div aria-hidden="true" style="flex-shrink: 0; position: relative; width: 60px; height: 80px; border-radius: 6px; background: #6F6A62; opacity: 0.45;"><span style="position: absolute; right: 8px; top: 8px; writing-mode: vertical-rl; font-family: 'Noto Serif SC', serif; font-size: 12px; font-weight: 900; color: #FFFFFF;">旧时光照相馆</span></div><div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;"><span style="display: flex; align-items: center; gap: 6px;"><span style="font-size: 15px; font-weight: 600; color: #6F665B;">旧时光照相馆</span><span style="flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: #FCEBEA; color: #B42318; white-space: nowrap;">已失效</span></span><span style="font-size: 13px; color: #6F665B;">家庭 · 整部 30 集</span><span style="font-size: 13px; line-height: 1.5; color: #B42318;">剧目已下架，无法订购</span><div style="display: flex; justify-content: flex-end;"><button type="button" onClick="{{removeC}}" style="min-height: 32px; padding: 0 12px; border-radius: 16px; display: flex; align-items: center; font-size: 13px; border: 1px solid #E7E1D8; background: #FFFFFF; font-family: inherit; color: #1D1A16; cursor: pointer;">删除</button></div></div></article></sc-if>
</main>
<div style="flex-shrink: 0; min-height: 64px; box-sizing: border-box; padding: 8px 16px; background: #FFFFFF; border-top: 1px solid #ECE6DD; display: flex; align-items: center; gap: 12px;">
<label style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px;"><input type="checkbox" checked="{{allOn}}" onChange="{{toggleAll}}" style="width: 20px; height: 20px; margin: 0; accent-color: #C4501B;">全选</label>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: flex-end;"><span style="font-size: 14px;">应扣 <span style="font-size: 18px; font-weight: 700; color: #C4501B;">{{total}}</span> 积分</span><span style="font-size: 12px; color: {{subColor}};">{{sub}}</span></div>
<sc-if value="{{canGo}}" hint-placeholder-val="{{true}}"><a href="Checkout.dc.html" style="height: 44px; padding: 0 20px; border-radius: 22px; background: #C4501B; color: #FFFFFF; display: flex; align-items: center; font-size: 15px; font-weight: 600;">去订购（{{count}}）</a></sc-if>
<sc-if value="{{short}}" hint-placeholder-val="{{false}}"><a href="TopUp.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C4501B; box-sizing: border-box; background: #FFFFFF; color: #A63F12; display: flex; align-items: center; font-size: 15px; font-weight: 600;">去加购积分</a></sc-if>
<sc-if value="{{none}}" hint-placeholder-val="{{false}}"><button type="button" disabled="{{yes}}" style="height: 44px; padding: 0 20px; border: none; border-radius: 22px; background: #D6CFC4; color: #4A433B; font-family: inherit; font-size: 15px; font-weight: 600;">去订购</button></sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const a = typeof st.a === 'boolean' ? st.a : true;
    const bConfirmed = !!st.bConfirmed;
    const b = bConfirmed && (typeof st.b === 'boolean' ? st.b : true);
    const showB = !st.removedB;
    const showC = !st.removedC;
    const avail = 2920;
    const total = (a ? 2160 : 0) + (showB && b ? 1980 : 0);
    const count = (a ? 1 : 0) + (showB && b ? 1 : 0);
    const selectable = 1 + (showB && bConfirmed ? 1 : 0);
    const allOn = count === selectable;
    const short = count > 0 && total > avail;
    return {
      yes: true,
      a: a, toggleA: () => this.setState({ a: !a }),
      b: b, toggleB: () => this.setState({ b: !b }),
      showB: showB, bOk: bConfirmed, bPending: !bConfirmed,
      confirmB: () => this.setState({ bConfirmed: true, b: true }),
      removeB: () => this.setState({ removedB: true }),
      showC: showC, removeC: () => this.setState({ removedC: true }),
      allOn: allOn,
      toggleAll: () => this.setState({ a: !allOn, b: bConfirmed ? !allOn : false }),
      total: fmt(total), count: count,
      sub: short ? '可用 2,920，还差 ' + fmt(total - avail) : '可用 2,920 积分',
      subColor: short ? '#B42318' : '#6F665B',
      canGo: count > 0 && !short, short: short, none: count === 0
    };
  }
}
</script>
