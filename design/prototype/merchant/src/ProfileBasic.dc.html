<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>狸有戏 · 建档：基础信息</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
body{margin:0;background:#F6F3EE}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
main::-webkit-scrollbar{display:none}
textarea::placeholder,input::placeholder{color:#6F665B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F6F3EE; color: #1D1A16; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
<header style="height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative;">
<a href="Profile.dc.html" aria-label="返回" style="position: absolute; left: 2px; top: 2px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1D1A16;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600;">基础信息</h1>
<div aria-hidden="true" style="position: absolute; right: 8px; top: 8px; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2DBD0; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-evenly;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#1D1A16"><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="2.4"></circle><circle cx="18.5" cy="12" r="1.8"></circle></svg>
<span style="width: 1px; height: 18px; background: #E2DBD0;"></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1A16" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3" fill="#1D1A16" stroke="none"></circle></svg>
</div>
</header>
<ol aria-label="建档步骤" style="flex-shrink: 0; margin: 0; box-sizing: border-box; padding: 6px 16px 12px; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
<li aria-current="step" style="display: flex; flex-direction: column; gap: 6px;"><span style="height: 4px; border-radius: 2px; background: #C4501B;"></span><span style="font-size: 12px; font-weight: 600; color: #A63F12;">1 基础信息</span></li>
<li style="display: flex; flex-direction: column; gap: 6px;"><span style="height: 4px; border-radius: 2px; background: #D6CFC4;"></span><span style="font-size: 12px; color: #6F665B;">2 门店形象</span></li>
<li style="display: flex; flex-direction: column; gap: 6px;"><span style="height: 4px; border-radius: 2px; background: #D6CFC4;"></span><span style="font-size: 12px; color: #6F665B;">3 服务与价格</span></li>
<li style="display: flex; flex-direction: column; gap: 6px;"><span style="height: 4px; border-radius: 2px; background: #D6CFC4;"></span><span style="font-size: 12px; color: #6F665B;">4 资质认证</span></li>
</ol>
<main style="flex-grow: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 12px;">
<section style="background: #FFFFFF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="brand" style="font-size: 14px; font-weight: 600;">品牌名称 <span style="color: #B42318;">*</span></label>
<input id="brand" type="text" value="{{brand}}" onChange="{{onBrand}}" style="box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid #E7E1D8; border-radius: 10px; font-family: inherit; font-size: 15px; color: #1D1A16;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 14px; font-weight: 600;">品牌 Logo</span>
<button type="button" style="width: 88px; height: 88px; border: 1px dashed #C9C0B3; border-radius: 12px; background: #FAF8F4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 12px; color: #6F665B; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>上传 Logo</button>
<span style="font-size: 12px; color: #6F665B;">JPG 或 PNG，不超过 5MB，建议 1:1</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="store" style="font-size: 14px; font-weight: 600;">门店名称 <span style="color: #B42318;">*</span></label>
<input id="store" type="text" value="{{store}}" onChange="{{onStore}}" style="box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid #E7E1D8; border-radius: 10px; font-family: inherit; font-size: 15px; color: #1D1A16;">
<span style="font-size: 12px; color: #6F665B;">修改门店名称需重新审核</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 14px; font-weight: 600;">行业与品类 <span style="color: #B42318;">*</span></span>
<button type="button" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E7E1D8; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font-family: inherit; font-size: 15px; color: #1D1A16; cursor: pointer;"><span>餐饮 / 火锅</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F665B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
<span style="font-size: 12px; line-height: 1.5; color: #6F665B;">用于推荐适配短剧与定制内容；修改需重新审核</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="addr" style="font-size: 14px; font-weight: 600;">门店地址 <span style="color: #B42318;">*</span></label>
<div style="display: flex; gap: 8px;">
<input id="addr" type="text" value="{{addr}}" onChange="{{onAddr}}" style="flex-grow: 1; min-width: 0; box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid #E7E1D8; border-radius: 10px; font-family: inherit; font-size: 15px; color: #1D1A16;">
<button type="button" style="flex-shrink: 0; height: 44px; padding: 0 12px; border: 1px solid #E7E1D8; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; gap: 4px; font-family: inherit; font-size: 14px; color: #1D1A16; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>地图选点</button>
</div>
<span style="font-size: 12px; color: #6F665B;">门店地址会出现在定制内容与广告中；修改需重新审核</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="hours" style="font-size: 14px; font-weight: 600;">营业时间 <span style="color: #B42318;">*</span></label>
<input id="hours" type="text" value="{{hours}}" onChange="{{onHours}}" style="box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid #E7E1D8; border-radius: 10px; font-family: inherit; font-size: 15px; color: #1D1A16;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="phone" style="font-size: 14px; font-weight: 600;">联系电话 <span style="color: #B42318;">*</span></label>
<input id="phone" type="tel" placeholder="手机或座机，将出现在广告中" value="{{phone}}" onChange="{{onPhone}}" style="box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid {{phoneBorder}}; border-radius: 10px; font-family: inherit; font-size: 15px; color: #1D1A16;">
<sc-if value="{{phoneError}}" hint-placeholder-val="{{false}}"><span role="alert" style="font-size: 12px; color: #B42318;">请填写联系电话</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="avg" style="font-size: 14px; font-weight: 600;">人均消费 <span style="color: #B42318;">*</span></label>
<div style="display: flex; align-items: center; gap: 8px;"><input id="avg" type="number" value="{{avg}}" onChange="{{onAvg}}" style="width: 120px; box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid #E7E1D8; border-radius: 10px; font-family: inherit; font-size: 15px; color: #1D1A16;"><span style="font-size: 14px; color: #6F665B;">元 / 人</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="intro" style="font-size: 14px; font-weight: 600;">品牌简介</label>
<textarea id="intro" rows="3" maxlength="300" placeholder="不超过 300 字" value="{{intro}}" onChange="{{onIntro}}" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #E7E1D8; border-radius: 10px; font-family: inherit; font-size: 15px; line-height: 1.5; color: #1D1A16; resize: none;"></textarea>
<span style="align-self: flex-end; font-size: 12px; color: #6F665B;">{{introCount}}/300</span>
</div>
</section>
</main>
<footer style="flex-shrink: 0; height: 72px; box-sizing: border-box; padding: 0 16px 8px; background: #FFFFFF; border-top: 1px solid #ECE6DD; display: flex; align-items: center; gap: 12px;">
<button type="button" onClick="{{saveDraft}}" style="flex-grow: 1; flex-basis: 0; height: 46px; border: 1px solid #C9C0B3; border-radius: 23px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #1D1A16; cursor: pointer;">{{draftLabel}}</button>
<sc-if value="{{canNext}}" hint-placeholder-val="{{false}}">
<a href="ProfileStore.dc.html" style="flex-grow: 1; flex-basis: 0; height: 46px; border-radius: 23px; background: #C4501B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">保存并下一步</a>
</sc-if>
<sc-if value="{{cannotNext}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{validate}}" style="flex-grow: 1; flex-basis: 0; height: 46px; border: none; border-radius: 23px; background: #C4501B; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">保存并下一步</button>
</sc-if>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const pick = (k, d) => (st[k] === undefined ? d : st[k]);
    const brand = pick('brand', 'XX 火锅');
    const store = pick('store', 'XX 火锅（万达店）');
    const addr = pick('addr', '成都市锦江区万达广场 3 楼');
    const hours = pick('hours', '10:00～22:00');
    const phone = pick('phone', '');
    const avg = pick('avg', '98');
    const intro = pick('intro', '本地老字号火锅，牛油锅底现炒，主打鲜切牛肉。');
    const set = (k) => (e) => this.setState({ [k]: e.target.value, draft: false });
    const filled = [brand, store, addr, hours, phone, avg].every((v) => String(v).trim() !== '');
    const phoneError = !!st.tried && phone.trim() === '';
    return {
      brand: brand, store: store, addr: addr, hours: hours, phone: phone, avg: avg, intro: intro,
      onBrand: set('brand'), onStore: set('store'), onAddr: set('addr'), onHours: set('hours'),
      onPhone: set('phone'), onAvg: set('avg'), onIntro: set('intro'),
      introCount: intro.length,
      phoneError: phoneError,
      phoneBorder: phoneError ? '#B42318' : '#E7E1D8',
      canNext: filled,
      cannotNext: !filled,
      validate: () => this.setState({ tried: true }),
      saveDraft: () => this.setState({ draft: true }),
      draftLabel: st.draft ? '草稿已保存' : '保存草稿'
    };
  }
}
</script>
</body>
</html>
