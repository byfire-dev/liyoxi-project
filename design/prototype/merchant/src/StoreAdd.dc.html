<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>狸有戏 · 新增门店</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
body{margin:0;background:#F6F3EE}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
main::-webkit-scrollbar{display:none}
textarea::placeholder,input::placeholder{color:#6F665B}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F6F3EE; color: #1D1A16; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
<header style="height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative;">
<a href="Stores.dc.html" aria-label="返回" style="position: absolute; left: 2px; top: 2px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1D1A16;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600;">新增门店</h1>
<div aria-hidden="true" style="position: absolute; right: 8px; top: 8px; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2DBD0; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-evenly;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#1D1A16"><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="2.4"></circle><circle cx="18.5" cy="12" r="1.8"></circle></svg>
<span style="width: 1px; height: 18px; background: #E2DBD0;"></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1A16" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3" fill="#1D1A16" stroke="none"></circle></svg>
</div>
</header>
<main style="flex-grow: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px;">
<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<p role="status" style="margin: 0; padding: 10px 12px; border-radius: 10px; background: {{toastBg}}; color: {{toastFg}}; font-size: 13px; font-weight: 600; line-height: 1.5;">{{toast}}</p>
</sc-if>
<section aria-label="经营主体" style="background: #FFFFFF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;"><span style="font-size: 13px; color: #6F665B;">经营主体</span><span style="flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: #E6F2EA; color: #256A42; white-space: nowrap;">已认证</span></div>
<span style="font-size: 16px; font-weight: 600;">XX 餐饮管理有限公司</span>
<span style="font-size: 13px; color: #6F665B;">专业版可管理 3 家门店，已有 2 家，还可新增 1 家</span>
<span style="font-size: 12px; line-height: 1.5; color: #6F665B;">同一主体下的门店共用套餐、积分、合同与发票抬头</span>
</section>
<section aria-label="门店信息" style="background: #FFFFFF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; font-size: 16px; font-weight: 600;">门店信息</h2>
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="st-name" style="font-size: 14px; font-weight: 600;">门店名称 <span style="color: #B42318;">*</span></label><input id="st-name" type="text" value="{{name}}" onChange="{{setName}}" style="box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid #E7E1D8; border-radius: 10px; font-family: inherit; font-size: 15px; color: #1D1A16; background: #FFFFFF;"></div>
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="st-addr" style="font-size: 14px; font-weight: 600;">门店地址 <span style="color: #B42318;">*</span></label><input id="st-addr" type="text" placeholder="请输入门店详细地址" value="{{addr}}" onChange="{{setAddr}}" style="box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid #E7E1D8; border-radius: 10px; font-family: inherit; font-size: 15px; color: #1D1A16; background: #FFFFFF;"></div>
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="st-cat" style="font-size: 14px; font-weight: 600;">行业与品类 <span style="color: #B42318;">*</span></label><button id="st-cat" type="button" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E7E1D8; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: inherit; font-size: 15px; color: #1D1A16; cursor: pointer;"><span>餐饮 / 火锅</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F665B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></div>
<p style="margin: 0; padding: 10px 12px; border-radius: 10px; background: #E8EEF9; color: #2E5AAC; font-size: 13px; line-height: 1.5;"><span style="display: block;">每家门店单独定制成片、单独绑定发布账号；</span><span style="display: block;">同一部剧可以为多家门店分别订购，分别扣积分。</span></p>
</section>
<section aria-label="从已有门店复制档案" style="background: #FFFFFF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;"><h2 style="margin: 0; font-size: 16px; font-weight: 600;">从已有门店复制档案</h2><span style="font-size: 13px; color: #6F665B;">可选</span></div>
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="cp-src" style="font-size: 14px; font-weight: 600;">复制来源</label><button id="cp-src" type="button" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E7E1D8; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: inherit; font-size: 15px; color: #1D1A16; cursor: pointer;"><span>XX 火锅（万达店）</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F665B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></div>
<div style="display: flex; flex-direction: column;"><label for="cp-1" style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; cursor: pointer;"><input id="cp-1" type="checkbox" checked="{{c1}}" onChange="{{t1}}" style="flex-shrink: 0; margin: 2px 0 0; width: 18px; height: 18px; accent-color: #C4501B;"><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px;">基础信息</span><span style="font-size: 12px; line-height: 1.5; color: #6F665B;">品牌名称、品牌简介、营业时间</span></span></label><label for="cp-2" style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; cursor: pointer;"><input id="cp-2" type="checkbox" checked="{{c2}}" onChange="{{t2}}" style="flex-shrink: 0; margin: 2px 0 0; width: 18px; height: 18px; accent-color: #C4501B;"><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px;">服务与价格</span><span style="font-size: 12px; line-height: 1.5; color: #6F665B;">主推菜品 5 项、优惠活动、团购信息</span></span></label><label for="cp-3" style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; cursor: pointer;"><input id="cp-3" type="checkbox" checked="{{c3}}" onChange="{{t3}}" style="flex-shrink: 0; margin: 2px 0 0; width: 18px; height: 18px; accent-color: #C4501B;"><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px;">门店形象</span><span style="font-size: 12px; line-height: 1.5; color: #6F665B;">门头与店内环境需本店实拍，默认不复制</span></span></label><label for="cp-4" style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; cursor: pointer;"><input id="cp-4" type="checkbox" checked="{{c4}}" onChange="{{t4}}" style="flex-shrink: 0; margin: 2px 0 0; width: 18px; height: 18px; accent-color: #C4501B;"><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px;">品牌故事素材</span><span style="font-size: 12px; line-height: 1.5; color: #6F665B;">12 条，复制到本店素材库</span></span></label></div>
</section>
<section aria-label="门店资质" style="background: #FFFFFF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; font-size: 16px; font-weight: 600;">门店资质</h2>
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.55;"><span style="display: flex; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#256A42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px;"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg><span>营业执照：沿用主体执照，无须重复上传</span></span><span style="display: flex; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A63F12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px;"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg><span>分支机构执照：如有请上传，须隶属本主体</span></span><span style="display: flex; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A63F12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px;"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg><span>食品经营许可证：餐饮门店需上传本店证件</span></span></div>
<p style="margin: 0; padding: 10px 12px; border-radius: 10px; background: #FBEDE5; color: #A63F12; font-size: 13px; line-height: 1.5;"><span style="display: block;">资质不能从其他门店复制，需在建档第 4 步提交；</span><span style="display: block;">平台 1 个工作日内审核，通过后即可为本店订购。</span></p>
</section>
</main>
<footer style="flex-shrink: 0; height: 72px; box-sizing: border-box; padding: 0 16px 8px; background: #FFFFFF; border-top: 1px solid #ECE6DD; display: flex; align-items: center; gap: 12px;">
<button type="button" onClick="{{create}}" style="flex-grow: 1; flex-basis: 0; height: 46px; padding: 0 16px; border-radius: 23px; border: none; background: #C4501B; color: #FFFFFF; font-weight: 600; font-family: inherit; font-size: 15px; cursor: pointer;">创建门店并继续建档</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};

    const toastTone = { ok: ['#E6F2EA', '#256A42'], info: ['#E8EEF9', '#2E5AAC'], warn: ['#FBEDE5', '#A63F12'] };
    const tt = toastTone[st.toastTone || 'ok'];
    const toastVals = { toast: st.toast || '', hasToast: !!st.toast, toastBg: tt[0], toastFg: tt[1] };

    const cp = st.cp || { '1': true, '2': true, '3': false, '4': true };
    const tog = (k) => () => this.setState({ cp: Object.assign({}, cp, { [k]: !cp[k] }) });
    const name = typeof st.name === 'string' ? st.name : 'XX 火锅（环球中心店）';
    const addr = typeof st.addr === 'string' ? st.addr : '成都市高新区 [详细地址]';
    return Object.assign({
      name: name, setName: (e) => this.setState({ name: e.target.value }),
      addr: addr, setAddr: (e) => this.setState({ addr: e.target.value }),
      c1: !!cp['1'], c2: !!cp['2'], c3: !!cp['3'], c4: !!cp['4'],
      t1: tog('1'), t2: tog('2'), t3: tog('3'), t4: tog('4'),
      create: () => this.setState(name.trim() === '' ? { toast: '请填写门店名称', toastTone: 'warn' }
        : addr.trim() === '' ? { toast: '请填写门店地址', toastTone: 'warn' }
        : { toast: '门店已创建，请继续完成门店形象与资质认证', toastTone: 'ok' })
    }, toastVals);
  }
}
</script>
</body>
</html>
