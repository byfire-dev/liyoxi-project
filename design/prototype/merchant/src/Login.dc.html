<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>狸有戏 · 登录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
body{margin:0;background:#F6F3EE}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F6F3EE; color: #1D1A16; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
<header style="height: 48px; flex-shrink: 0; position: relative;">
<div aria-hidden="true" style="position: absolute; right: 8px; top: 8px; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2DBD0; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-evenly;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#1D1A16"><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="2.4"></circle><circle cx="18.5" cy="12" r="1.8"></circle></svg>
<span style="width: 1px; height: 18px; background: #E2DBD0;"></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1A16" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3" fill="#1D1A16" stroke="none"></circle></svg>
</div>
</header>
<main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 36px 28px 0; display: flex; flex-direction: column;">
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#C4501B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12 22 25h20l12-13-2 22-20 19-20-19z"></path><path d="m21 34 5 2.5M43 34l-5 2.5"></path><circle cx="32" cy="44" r="1.6" fill="#C4501B" stroke="none"></circle></svg>
<h1 style="margin: 20px 0 0; font-family: 'Noto Serif SC', serif; font-size: 44px; font-weight: 900; letter-spacing: 6px;">狸有戏</h1>
<p style="margin: 10px 0 0; font-family: 'Noto Serif SC', serif; font-size: 20px; font-weight: 700;">用短剧，为门店引流获客</p>
<p style="margin: 10px 0 0; font-size: 14px; line-height: 1.7; color: #6F665B;"><span style="display: block;">正版短剧为您的门店单独定制，</span><span style="display: block;">一次性上线到您的抖音号、视频号。</span></p>
<ul style="margin: 32px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 18px;">
<li style="display: flex; gap: 14px; align-items: flex-start;">
<span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; background: #FBEDE5; color: #A63F12; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"></path><path d="m9 12 2 2 4-4"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">正版授权</span><span style="font-size: 13px; color: #6F665B;">每笔订购附《定制内容授权书》，放心上线</span></span>
</li>
<li style="display: flex; gap: 14px; align-items: flex-start;">
<span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; background: #FBEDE5; color: #A63F12; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">套餐 ＋ 积分</span><span style="font-size: 13px; color: #6F665B;">按月开通套餐，订剧、做广告都用积分</span></span>
</li>
<li style="display: flex; gap: 14px; align-items: flex-start;">
<span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; background: #FBEDE5; color: #A63F12; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m10 8.5 5 3.5-5 3.5z"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">省心交付</span><span style="font-size: 13px; color: #6F665B;">建档后，广告制作、植入与成片交付由平台完成</span></span>
</li>
</ul>
</main>
<footer style="flex-shrink: 0; box-sizing: border-box; padding: 0 28px 36px; display: flex; flex-direction: column; gap: 14px;">
<sc-if value="{{hint}}" hint-placeholder-val="{{false}}">
<p role="alert" style="margin: 0; font-size: 13px; color: #B42318;">请先阅读并勾选下方协议</p>
</sc-if>
<sc-if value="{{agreed}}" hint-placeholder-val="{{true}}">
<a href="Main.dc.html" style="height: 50px; border-radius: 25px; background: #C4501B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><path d="M11 18.5h2"></path></svg>微信手机号快捷登录</a>
</sc-if>
<sc-if value="{{notAgreed}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{nudge}}" style="height: 50px; border: none; border-radius: 25px; background: #C4501B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><path d="M11 18.5h2"></path></svg>微信手机号快捷登录</button>
</sc-if>
<div style="display: flex; gap: 8px; align-items: flex-start;">
<input id="agree" type="checkbox" checked="{{agreed}}" onChange="{{toggle}}" style="flex-shrink: 0; width: 18px; height: 18px; margin: 1px 0 0; accent-color: #C4501B;">
<label for="agree" style="font-size: 13px; line-height: 1.5; color: #6F665B;">我已阅读并同意《用户服务协议》《隐私政策》，首次登录将自动创建商家账号</label>
</div>
<a href="Mall.dc.html" style="align-self: center; min-height: 44px; display: flex; align-items: center; font-size: 14px; color: #6F665B;">先逛逛，看看有哪些短剧 ›</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const agreed = !!st.agreed;
    return {
      agreed: agreed,
      notAgreed: !agreed,
      hint: !!st.hint && !agreed,
      toggle: () => this.setState({ agreed: !agreed, hint: false }),
      nudge: () => this.setState({ hint: true })
    };
  }
}
</script>
</body>
</html>
