<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>狸有戏 · 预告片模式</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
body{margin:0;background:#0F0E0C}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0F0E0C; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
<div aria-hidden="true" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: {{d.color}};"></div>
<div aria-hidden="true" style="position: absolute; top: 60px; right: 12px; bottom: 12px; left: 12px; border: 1px solid rgba(255,255,255,0.18); border-radius: 12px;"></div>
<div aria-hidden="true" style="position: absolute; right: 104px; top: 150px; writing-mode: vertical-rl; font-family: 'Noto Serif SC', serif; font-size: 46px; font-weight: 900; letter-spacing: 10px; color: #FFFFFF;">{{d.title}}</div>
<span aria-hidden="true" style="position: absolute; right: 28px; top: 76px; font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,0.6);">狸有戏 · 预告片</span>
<header style="position: absolute; top: 0; right: 0; left: 0; height: 48px; display: flex; align-items: center; justify-content: center;">
<a href="Mall.dc.html" style="position: absolute; left: 4px; top: 2px; height: 44px; padding: 0 8px; display: flex; align-items: center; gap: 2px; font-size: 15px; color: #FFFFFF;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg>列表</a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600;">预告片</h1>
<div aria-hidden="true" style="position: absolute; right: 8px; top: 8px; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.35); border-radius: 16px; background: rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: space-evenly;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF"><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="2.4"></circle><circle cx="18.5" cy="12" r="1.8"></circle></svg>
<span style="width: 1px; height: 18px; background: rgba(255,255,255,0.35);"></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3" fill="#FFFFFF" stroke="none"></circle></svg>
</div>
</header>
<button type="button" onClick="{{toggleMute}}" style="position: absolute; left: 24px; top: 72px; min-height: 36px; padding: 0 12px; border: none; border-radius: 18px; background: rgba(0,0,0,0.4); color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 13px; cursor: pointer;"><sc-if value="{{muted}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="m17 9 4 6m0-6-4 6"></path></svg></sc-if><sc-if value="{{unmuted}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg></sc-if>{{muteLabel}}</button>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 330px; background: rgba(15,14,12,0.62);"></div>
<div style="position: absolute; right: 14px; top: 300px; display: flex; flex-direction: column; gap: 14px; align-items: center;">
<a href="Detail.dc.html" style="width: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px;"><span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg></span>详情</a>
<a href="Cart.dc.html" style="width: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px;"><span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>加选剧单</a>
<button type="button" onClick="{{share}}" style="width: 56px; padding: 0; border: none; background: none; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: inherit; font-size: 12px; cursor: pointer;"><span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="m8.2 10.8 7.6-4.6M8.2 13.2l7.6 4.6"></path></svg></span>{{shareLabel}}</button>
<button type="button" onClick="{{next}}" style="width: 56px; padding: 0; border: none; background: none; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: inherit; font-size: 12px; cursor: pointer;"><span style="width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>下一部</button>
</div>
<section aria-label="短剧信息" style="position: absolute; left: 16px; right: 90px; bottom: 136px; display: flex; flex-direction: column; gap: 6px;">
<span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: {{d.exBg}}; color: #FFFFFF;">{{d.exLabel}}</span>
<h2 style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 24px; font-weight: 900; letter-spacing: 1px;">《{{d.title}}》</h2>
<span style="font-size: 13px; color: rgba(255,255,255,0.8);">{{d.genre}} · {{d.eps}} 集 · 热度 {{d.heat}}</span>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.86);">{{d.intro}}</p>
<span style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 17px; font-weight: 700; color: #F2B48F;">{{d.ptsText}} 积分</span><span style="font-size: 13px; color: rgba(255,255,255,0.8);">专业版实扣 {{d.netText}}</span></span>
</section>
<div style="position: absolute; left: 16px; right: 16px; bottom: 92px; display: flex; align-items: center; gap: 10px;">
<div aria-hidden="true" style="flex-grow: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.25); display: flex;"><span style="width: 36%; height: 3px; border-radius: 2px; background: #FFFFFF;"></span></div>
<span style="font-size: 12px; color: rgba(255,255,255,0.8);">00:32 / 01:30</span>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; gap: 12px;">
<a href="Detail.dc.html" style="flex-grow: 1; height: 48px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.7); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600;">查看详情</a>
<a href="Cart.dc.html" style="flex-grow: 1; height: 48px; border-radius: 24px; background: #C4501B; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600;">加入选剧单</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const idx = st.idx || 0;
    const muted = st.muted === undefined ? true : st.muted;
    const fmt = (n) => n.toLocaleString('en-US');
    const base = [
      { title: '巷口那家店', genre: '都市温情', eps: 80, pts: 3000, heat: 'S', color: '#2F4A3F', intro: '老城巷口的小面馆面临拆迁，女儿辞职回乡接手，用一碗面串起街坊邻里的故事。' },
      { title: '二次开业', genre: '逆袭', eps: 60, pts: 2000, heat: 'A', color: '#6B2D2A', intro: '美发店老板娘被合伙人挤走，三个月后在对街重新开业，一步步赢回老顾客。' },
      { title: '心动便利店', genre: '甜宠', eps: 40, pts: 2400, heat: 'A', color: '#1F2B45', intro: '深夜便利店的店员与常来买关东煮的设计师，从一次找零开始了心动。' },
      { title: '夜巷疑云', genre: '悬疑', eps: 45, pts: 3000, heat: 'S', color: '#3D5A6B', intro: '夜市摊主接连收到匿名纸条，一条老巷里的旧案慢慢浮出水面。' },
      { title: '锦绣小厨娘', genre: '古装', eps: 80, pts: 2600, heat: 'B', color: '#7A5A2E', intro: '落魄千金凭一手家传菜谱在京城开起食肆，以菜会友，化解一场场风波。' },
      { title: '家有萌娃', genre: '家庭喜剧', eps: 36, pts: 1200, heat: 'B', color: '#5B3F63', intro: '新手爸爸独自带娃的一百天，鸡飞狗跳又温暖治愈。' }
    ];
    const cur = base[idx % base.length];
    const d = {
      ...cur,
      ptsText: fmt(cur.pts),
      netText: fmt(Math.round(cur.pts * 0.9)),
      exLabel: '订购后为您的门店单独定制',
      exBg: '#256A42'
    };
    return {
      d: d,
      muted: muted,
      unmuted: !muted,
      muteLabel: muted ? '已静音，点击开启声音' : '声音已开启',
      toggleMute: () => this.setState({ muted: !muted }),
      next: () => this.setState({ idx: idx + 1, shared: false }),
      share: () => this.setState({ shared: true }),
      shareLabel: st.shared ? '已复制' : '分享'
    };
  }
}
</script>
</body>
</html>
