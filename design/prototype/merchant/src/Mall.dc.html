<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>狸有戏 · 短剧商城</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
body{margin:0;background:#F6F3EE}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
main::-webkit-scrollbar{display:none}
input::placeholder{color:#6F665B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F6F3EE; color: #1D1A16; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
<header style="height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative;">
<h1 style="margin: 0; font-size: 17px; font-weight: 600;">短剧商城</h1>
<div aria-hidden="true" style="position: absolute; right: 8px; top: 8px; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2DBD0; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-evenly;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#1D1A16"><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="2.4"></circle><circle cx="18.5" cy="12" r="1.8"></circle></svg>
<span style="width: 1px; height: 18px; background: #E2DBD0;"></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1A16" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3" fill="#1D1A16" stroke="none"></circle></svg>
</div>
</header>
<div style="flex-shrink: 0; box-sizing: border-box; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; gap: 10px; align-items: center;">
<label style="flex-grow: 1; height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E7E1D8; display: flex; align-items: center; gap: 8px; color: #6F665B;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" aria-label="搜索短剧" placeholder="搜索剧名、题材" value="{{q}}" onChange="{{onQ}}" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 14px; color: #1D1A16;">
</label>
<div role="group" aria-label="浏览模式" style="flex-shrink: 0; height: 40px; box-sizing: border-box; padding: 3px; border-radius: 20px; background: #ECE6DD; display: flex; gap: 2px;">
<span aria-current="page" style="height: 34px; box-sizing: border-box; padding: 0 12px; border-radius: 17px; background: #FFFFFF; display: flex; align-items: center; font-size: 13px; font-weight: 600;">列表</span>
<a href="Trailer.dc.html" style="height: 34px; box-sizing: border-box; padding: 0 12px; border-radius: 17px; display: flex; align-items: center; gap: 4px; font-size: 13px; color: #6F665B;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>预告片</a>
</div>
</div>
<div role="tablist" aria-label="题材分类" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px;">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
<button type="button" role="tab" aria-selected="{{c.active}}" onClick="{{c.pick}}" style="flex-shrink: 0; height: 34px; box-sizing: border-box; padding: 0 14px; border-radius: 17px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 14px; cursor: pointer;">{{c.label}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px;">
<button type="button" onClick="{{nextSort}}" style="min-height: 44px; padding: 0; border: none; background: none; display: flex; align-items: center; gap: 4px; font-family: inherit; font-size: 14px; color: #1D1A16; cursor: pointer;">{{sortLabel}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<button type="button" aria-pressed="{{onlyEx}}" onClick="{{toggleEx}}" style="min-height: 44px; padding: 0; border: none; background: none; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 14px; color: #1D1A16; cursor: pointer;"><span aria-hidden="true" style="width: 34px; height: 20px; box-sizing: border-box; padding: 2px; border-radius: 10px; background: {{trackColor}}; display: flex;"><span style="width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF; margin-left: {{knobX}};"></span></span>仅看适配餐饮</button>
<span style="margin-left: auto; font-size: 12px; color: #6F665B;">按门店品类（火锅）推荐</span>
</div>
</div>
<main style="flex-grow: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 4px 16px 20px;">
<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<sc-for list="{{list}}" as="d" hint-placeholder-count="4">
<a href="Detail.dc.html" style="display: flex; flex-direction: column; gap: 4px; background: #FFFFFF; border-radius: 12px; padding: 8px 8px 12px;">
<div style="position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; background: {{d.color}};">
<div style="position: absolute; top: 7px; right: 7px; bottom: 7px; left: 7px; border: 1px solid rgba(255,255,255,0.28); border-radius: 5px;"></div>
<div style="position: absolute; right: 16px; top: 16px; writing-mode: vertical-rl; font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 22px; letter-spacing: 4px; color: #FFFFFF;">{{d.title}}</div>
<sc-if value="{{d.hasBadge}}" hint-placeholder-val="{{true}}"><span style="position: absolute; left: 10px; top: 10px; font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: #FFFFFF; color: {{d.badgeColor}};">{{d.badge}}</span></sc-if>
<span style="position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: rgba(255,255,255,0.9);">{{d.genre}}</span>
</div>
<span style="margin-top: 4px; font-size: 15px; font-weight: 600;">{{d.title}}</span>
<span style="font-size: 12px; color: #6F665B;">{{d.eps}} 集 · 热度 {{d.heat}}</span>
<span style="font-size: 15px; font-weight: 700; color: #C4501B;">{{d.ptsText}} <span style="font-size: 12px; font-weight: 600;">积分</span></span>
<span style="font-size: 12px; color: #6F665B;">专业版实扣 {{d.netText}}</span>
</a>
</sc-for>
</div>
</sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="padding: 80px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
<span style="font-size: 15px; font-weight: 600;">没有找到符合条件的短剧</span>
<span style="font-size: 13px; color: #6F665B;">换个关键词，或清除筛选条件再试试</span>
<button type="button" onClick="{{reset}}" style="min-height: 44px; padding: 0 20px; border-radius: 22px; border: 1px solid #1D1A16; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #1D1A16; cursor: pointer;">清除筛选</button>
</div>
</sc-if>
</main>
<nav aria-label="底部导航" style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding-bottom: 8px; background: #FFFFFF; border-top: 1px solid #ECE6DD; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6F665B;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span style="font-size: 12px;">首页</span></a>
<a href="Mall.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #C4501B;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="m10 9 5 3-5 3z"></path></svg><span style="font-size: 12px; font-weight: 600;">短剧商城</span></a>
<a href="Cart.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6F665B;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"></path></svg><span style="position: absolute; top: 5px; left: 50%; margin-left: 6px; min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 4px; border-radius: 8px; background: #C4501B; color: #FFFFFF; font-size: 11px; font-weight: 600; line-height: 16px; text-align: center;">2</span><span style="font-size: 12px;">选剧单</span></a>
<a href="Mine.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6F665B;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"></path></svg><span style="font-size: 12px;">我的</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const cat = st.cat || '全部';
    const onlyOk = !!st.onlyOk;
    const net = (d) => Math.round(d.pts * 0.9);
    const sortIdx = st.sortIdx || 0;
    const q = st.q || '';
    const fmt = (n) => n.toLocaleString('en-US');
    const base = [
      { title: '巷口那家店', genre: '都市温情', cats: ['都市'], eps: 80, pts: 3000, heat: 'S', color: '#2F4A3F', badge: '热播', badgeColor: '#A63F12', food: true },
      { title: '二次开业', genre: '逆袭', cats: ['逆袭', '都市'], eps: 60, pts: 2000, heat: 'A', color: '#6B2D2A', badge: '', badgeColor: '#6F665B', food: true },
      { title: '心动便利店', genre: '甜宠', cats: ['甜宠', '都市'], eps: 40, pts: 2400, heat: 'A', color: '#1F2B45', badge: '新剧', badgeColor: '#2E5AAC', food: true },
      { title: '夜巷疑云', genre: '悬疑', cats: ['悬疑'], eps: 45, pts: 3000, heat: 'S', color: '#3D5A6B', badge: '热播', badgeColor: '#A63F12', food: false },
      { title: '面馆少东家', genre: '逆袭', cats: ['逆袭'], eps: 70, pts: 2400, heat: 'A', color: '#5A3E2B', badge: '新剧', badgeColor: '#2E5AAC', food: true },
      { title: '老街烟火', genre: '都市温情', cats: ['都市'], eps: 50, pts: 2200, heat: 'A', color: '#4E6B5A', badge: '', badgeColor: '#6F665B', food: true },
      { title: '锦绣小厨娘', genre: '古装', cats: ['古装'], eps: 80, pts: 2600, heat: 'B', color: '#7A5A2E', badge: '', badgeColor: '#6F665B', food: true },
      { title: '家有萌娃', genre: '家庭喜剧', cats: ['家庭', '喜剧'], eps: 36, pts: 1200, heat: 'B', color: '#5B3F63', badge: '', badgeColor: '#6F665B', food: false }
    ];
    const heatRank = { S: 0, A: 1, B: 2 };
    let list = base.filter((d) => (cat === '全部' || d.cats.indexOf(cat) >= 0) && (!onlyOk || d.food) && (q === '' || d.title.indexOf(q) >= 0 || d.genre.indexOf(q) >= 0));
    if (sortIdx === 1) list = list.slice().sort((x, y) => x.pts - y.pts);
    if (sortIdx === 2) list = list.slice().sort((x, y) => y.pts - x.pts);
    if (sortIdx === 3) list = list.slice().sort((x, y) => heatRank[x.heat] - heatRank[y.heat]);
    list = list.map((d) => ({
      ...d,
      ptsText: fmt(d.pts),
      netText: fmt(net(d)),
      hasBadge: d.badge !== ''
    }));
    const sorts = ['综合排序', '积分价从低到高', '积分价从高到低', '热度优先'];
    const catNames = ['全部', '都市', '甜宠', '家庭', '逆袭', '悬疑', '古装', '喜剧'];
    return {
      q: q,
      onQ: (e) => this.setState({ q: e.target.value }),
      cats: catNames.map((c) => ({
        label: c,
        active: c === cat,
        pick: () => this.setState({ cat: c }),
        bg: c === cat ? '#1D1A16' : '#FFFFFF',
        fg: c === cat ? '#FFFFFF' : '#1D1A16',
        border: c === cat ? '#1D1A16' : '#E7E1D8'
      })),
      sortLabel: sorts[sortIdx],
      nextSort: () => this.setState({ sortIdx: (sortIdx + 1) % sorts.length }),
      onlyEx: onlyOk,
      toggleEx: () => this.setState({ onlyOk: !onlyOk }),
      trackColor: onlyOk ? '#C4501B' : '#D6CFC4',
      knobX: onlyOk ? '14px' : '0px',
      list: list,
      hasItems: list.length > 0,
      empty: list.length === 0,
      reset: () => this.setState({ cat: '全部', onlyOk: false, q: '', sortIdx: 0 })
    };
  }
}
</script>
</body>
</html>
