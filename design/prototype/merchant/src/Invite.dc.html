<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>狸有戏 · 邀请店员</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
body{margin:0;background:#F6F3EE}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
main::-webkit-scrollbar{display:none}
textarea::placeholder,input::placeholder{color:#6F665B}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F6F3EE; color: #1D1A16; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
<header style="height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative;">
<a href="Members.dc.html" aria-label="返回" style="position: absolute; left: 2px; top: 2px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1D1A16;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600;">邀请店员</h1>
<div aria-hidden="true" style="position: absolute; right: 8px; top: 8px; width: 87px; height: 32px; box-sizing: border-box; border: 1px solid #E2DBD0; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-evenly;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#1D1A16"><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="2.4"></circle><circle cx="18.5" cy="12" r="1.8"></circle></svg>
<span style="width: 1px; height: 18px; background: #E2DBD0;"></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1A16" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3" fill="#1D1A16" stroke="none"></circle></svg>
</div>
</header>
<main style="flex-grow: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px;">
<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<p role="status" style="margin: 0; padding: 10px 12px; border-radius: 10px; background: {{toastBg}}; color: {{toastFg}}; font-size: 13px; font-weight: 600; line-height: 1.5;">{{toast}}</p>
</sc-if>
<section aria-label="邀请的角色" style="background: #FFFFFF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; font-size: 16px; font-weight: 600;">邀请的角色：店员</h2>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px;"><li style="display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 1.55;"><span style="flex-shrink: 0; height: 22px; display: flex; align-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#256A42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span><span>在本店商家档案中上传图片、视频、录音等素材</span></li><li style="display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 1.55;"><span style="flex-shrink: 0; height: 22px; display: flex; align-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#256A42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span><span>查看自己上传的素材被整理、被采用的情况</span></li><li style="display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 1.55;"><span style="flex-shrink: 0; height: 22px; display: flex; align-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F665B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span><span>看不到积分、订单金额、合同与发票</span></li><li style="display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 1.55;"><span style="flex-shrink: 0; height: 22px; display: flex; align-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F665B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span><span>不能订购、付款，也不能确认方案、样片与广告</span></li></ul>
<span style="font-size: 12px; line-height: 1.5; color: #6F665B;">成员名额已用 3 / 10 位（含 1 个待接受的邀请）</span>
</section>
<section aria-label="邀请卡片预览" style="background: #FFFFFF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;"><h2 style="margin: 0; font-size: 16px; font-weight: 600;">邀请卡片预览</h2><span style="font-size: 12px; color: #6F665B;">点卡片可预览对方看到的页面</span></div>
<a href="Join.dc.html" aria-label="预览邀请卡片：王先生邀请您加入 XX 火锅（万达店）" style="width: 272px; align-self: center; box-sizing: border-box; padding: 12px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E7E1D8; box-shadow: 0 2px 8px rgba(29,26,22,0.06); display: flex; flex-direction: column; gap: 8px;"><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6F665B;"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9px; background: #C4501B; color: #FFFFFF; font-family: 'Noto Serif SC', serif; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center;">狸</span>狸有戏</span><span style="font-size: 15px; line-height: 1.45; color: #1D1A16;"><span style="display: block;">王先生邀请您加入门店，</span><span style="display: block;">一起上传门店素材</span></span><span aria-hidden="true" style="height: 168px; border-radius: 8px; background: #1D1A16; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 0 18px;"><span style="font-size: 11px; letter-spacing: 2px; color: #F2B48F;">门店协作邀请</span><span style="font-family: 'Noto Serif SC', serif; font-size: 20px; font-weight: 900; color: #FFFFFF; letter-spacing: 1px;">XX 火锅（万达店）</span><span style="font-size: 13px; color: #E9E3DA;">邀请您以“店员”身份加入</span></span><span style="padding-top: 6px; border-top: 1px solid #F0EBE3; font-size: 11px; color: #6F665B;">小程序</span></a>
<span style="display: flex; flex-direction: column; font-size: 12px; line-height: 1.5; color: #6F665B;"><span>邀请 24 小时内有效；对方需用微信手机号验证后加入。</span><span>对方加入后，您会收到通知。</span></span>
</section>
</main>
<footer style="flex-shrink: 0; height: 72px; box-sizing: border-box; padding: 0 16px 8px; background: #FFFFFF; border-top: 1px solid #ECE6DD; display: flex; align-items: center; gap: 12px;">
<button type="button" onClick="{{send}}" style="flex-grow: 1; flex-basis: 0; height: 46px; padding: 0 16px; border-radius: 23px; border: none; background: #C4501B; color: #FFFFFF; font-weight: 600; font-family: inherit; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"></path></svg><span>发送给微信好友</span></button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};

    const toastTone = { ok: ['#E6F2EA', '#256A42'], info: ['#E8EEF9', '#2E5AAC'], warn: ['#FBEDE5', '#A63F12'] };
    const tt = toastTone[st.toastTone || 'ok'];
    const toastVals = { toast: st.toast || '', hasToast: !!st.toast, toastBg: tt[0], toastFg: tt[1] };

    return Object.assign({
      send: () => this.setState({ toast: '邀请卡片已生成，请选择要发送的微信好友', toastTone: 'ok' })
    }, toastVals);
  }
}
</script>
</body>
</html>
