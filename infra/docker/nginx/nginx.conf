# 狸有戏 · gateway 的主配置（D7 第 7.2 节“gateway（nginx）要点”；W1-22）。站点在模板里（templates/）。
# 容器以非 root 用户跑、根文件系统只读：进程号文件、临时目录、渲染出来的站点配置都在 /tmp/nginx（内存盘）。
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;

  # 请求体上限 2MB（回调 1MB，写在站点里）；大文件一律直传对象存储。请求体整个放内存，不落临时文件
  client_max_body_size 2m;
  client_body_buffer_size 2m;

  # 请求编号：客户端带了合规的（36 个字符的 UUID，与 api 认的写法相同）就沿用，否则在这里生成一个传给 api。
  # 访问日志记的就是 api 用的那一个，两边的日志对得上。
  map $request_id $lyx_generated_request_id {
    "~^(?<a>[0-9a-f]{8})(?<b>[0-9a-f]{4})(?<c>[0-9a-f]{4})(?<d>[0-9a-f]{4})(?<e>[0-9a-f]{12})$" "$a-$b-$c-$d-$e";
  }
  map $http_x_request_id $lyx_request_id {
    default $lyx_generated_request_id;
    "~*^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $http_x_request_id;
  }
  # TLS 在负载均衡终止：它说是 https 就传 https，别的一律按本机收到的协议算
  map $http_x_forwarded_proto $lyx_forwarded_proto {
    default $scheme;
    https https;
  }

  # 访问日志只记路径，不记查询串：回调的签名与令牌、验真码都在查询串里
  map $request_uri $lyx_request_path {
    "~^(?<path>[^?]*)" $path;
  }
  # 访问日志一行一条 JSON，算 P95 与 5xx 率用。remote_addr 是按可信代理换算过的客户端地址
  log_format lyx_json escape=json
    '{"time":"$time_iso8601","request_id":"$lyx_request_id","remote_addr":"$remote_addr",'
    '"host":"$host","method":"$request_method","path":"$lyx_request_path","status":$status,'
    '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time","upstream_status":"$upstream_status",'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout lyx_json;

  include /tmp/nginx/conf.d/*.conf;
}
